# GitHub Pages serves this repo directly from the `main` branch root
# (legacy build). No Actions deploy is required — every push to main
# republishes https://az212z.github.io/baaqa/ automatically.
#
# This workflow is kept manual-only as a health check.

name: Pages health check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live site responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://az212z.github.io/baaqa/)
          echo "https://az212z.github.io/baaqa/ -> $code"
          test "$code" = "200"
