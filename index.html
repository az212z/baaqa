function renderRecipient(card) {
  document.querySelectorAll('.recipient').forEach(n => n.remove());
  const p = paletteOf(card), ft = fontOf(card);
  document.getElementById('app').innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'recipient on';
  wrap.style.cssText = `--rec-bg:${p.bg};--rec-ink:${p.ink};--rec-accent:${p.accent};--rec-font:${ft.css}`;
  document.body.appendChild(wrap);
  document.body.style.background = p.bg;
  const back = `<button class="rec-back" id="recBack">‹ رجوع</button>`;
  const wireBack = () => { const b = wrap.querySelector('#recBack'); if (b) b.onclick = () => { location.href = HOME(); }; };

  // A scheduled card stays locked behind a countdown until its moment, then
  // re-renders into the normal opener.
  const openAtMs = (card.openAt || 0) * 1000;
  if (openAtMs > Date.now()) {
    wrap.innerHTML = back + countdownBody(card);
    wireBack();
    runMotion(wrap.querySelector('#cv'), animOf(card), p.accent);
    startCountdown(wrap, openAtMs, () => renderRecipient(card));
    return;
  }

  wrap.innerHTML = back + recipientBody(card);
  wireBack();

  // The open gesture (envelope tap, or the first scratch) is what lets audio
  // play. A YouTube song, when set, plays instead of the synthesised sound.
  const sid = soundOf(card);
  let played = false;
  const play = () => {
    if (played) return; played = true;
    if (card.ytId) startYouTube(wrap, card.ytId, card.ytStart || 0);
    else playCardSound(sid);
  };

  if (card.openMode === 1) {
    wireScratch(wrap, animOf(card), p.accent, { onReveal: play });
  } else {
    wireRecipient(wrap, animOf(card), p.accent, false);
    const env = wrap.querySelector('#env');
    env.addEventListener('click', play);
    env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') play(); });
  }
}

// Scratch-to-reveal wiring. The gold foil is painted on a canvas and erased
// with destination-out where the finger drags; past ~42% cleared it wipes the
// rest, runs the motion, and fires onReveal (sound/song). `auto` self-clears for
// the composer preview. Serialised into the preview iframe alongside wireRecipient.
function wireScratch(root, animId, accent, opts) {
  opts = opts || {};
  const cv = root.querySelector('#scratch');
  const motion = root.querySelector('#cv');
  const hint = root.querySelector('#scratchHint');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const paint = () => {
    const w = cv.width, h = cv.height;
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#E9CE86'); g.addColorStop(.5, '#C9A14A'); g.addColorStop(1, '#B4842F');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = Math.max(6, w * .02);
    for (let i = -1; i < 7; i++) { ctx.beginPath(); ctx.moveTo(i * w / 5, 0); ctx.lineTo(i * w / 5 + h * .4, h); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for (let i = 0; i < 90; i++) ctx.fillRect((i * 97 % w), (i * 53 % h), 2, 2);
  };
  // The foil is position:fixed inset:0, i.e. the viewport — size it from the
  // window so it is correct even before CSS layout settles.
  const fit = () => { cv.width = Math.round(window.innerWidth * dpr); cv.height = Math.round(window.innerHeight * dpr); paint(); };
  fit();
  window.addEventListener('resize', fit);
  const R = Math.round(26 * dpr);
  let drawing = false, revealed = false, moves = 0;
  const at = e => { const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * dpr, y: (t.clientY - r.top) * dpr }; };
  // destination-out removes coverage in proportion to the brush's alpha, so the
  // brush must be fully opaque or the foil only fades instead of clearing.
  const erase = (x, y) => { ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,1)'; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.28); ctx.fill(); };
  const cleared = () => {
    const w = cv.width, h = cv.height, step = Math.max(8, Math.floor(w / 60));
    let clr = 0, tot = 0;
    try {
      const d = ctx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) { tot++; if (d[(y * w + x) * 4 + 3] < 128) clr++; }
    } catch (e) { return 0; }
    return tot ? clr / tot : 0;
  };
  const finish = () => {
    if (revealed) return; revealed = true;
    cv.classList.add('gone'); if (hint) hint.remove();
    setTimeout(() => cv.remove(), 650);
    runMotion(motion, animId, accent);
    if (opts.onReveal) opts.onReveal();
  };
  const down = e => { drawing = true; if (hint) hint.style.opacity = '0'; const p = at(e); erase(p.x, p.y); e.preventDefault(); };
  const move = e => { if (!drawing) return; const p = at(e); erase(p.x, p.y); if (++moves % 8 === 0 && cleared() > 0.42) finish(); e.preventDefault(); };
  const up = () => { if (!drawing) return; drawing = false; if (cleared() > 0.42) finish(); };
  cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, { passive: false }); cv.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
  if (opts.auto) setTimeout(() => {
    if (hint) hint.style.opacity = '0';
    const w = cv.width, h = cv.height; let i = 0;
    const sweep = setInterval(() => { for (let k = 0; k < 7; k++) erase(Math.random() * w, Math.random() * h); if (++i > 42) { clearInterval(sweep); finish(); } }, 30);
  }, 950);
}

// Send a command to a YouTube embed via its JS-API postMessage channel — no
// external script needed, only `enablejsapi=1` on the embed URL.
function ytCmd(iframe, func) {
  try { iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*'); } catch (e) {}
}
// Start the song. The iframe is created inside the open gesture, so autoplay
// with sound is allowed. It is kept off-screen (audio only); a small pill lets
// the recipient pause or resume.
function startYouTube(root, id, start) {
  root.querySelectorAll('.yt-embed, .rec-music').forEach(n => n.remove());
  const holder = document.createElement('div');
  holder.className = 'yt-embed';
  const src = 'https://www.youtube-nocookie.com/embed/' + id
    + '?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1' + (start ? ('&start=' + start) : '');
  holder.innerHTML = '<iframe src="' + src + '" title="أغنية الكرت" '
    + 'allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  root.appendChild(holder);
  const iframe = holder.querySelector('iframe');

  const bars = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  const tri = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ctrl = document.createElement('button');
  ctrl.className = 'rec-music';
  let playing = true;
  const label = () => { ctrl.innerHTML = (playing ? bars : tri) + '<span>' + (playing ? 'إيقاف الأغنية' : 'تشغيل الأغنية') + '</span>'; };
  label();
  ctrl.onclick = () => { playing = !playing; ytCmd(iframe, playing ? 'playVideo' : 'pauseVideo'); label(); };
  root.appendChild(ctrl);
}

// Shared by the live page and the preview iframe, so it is serialised by name.
function wireRecipient(root, animId, accent, autoplay) {
  const env = root.querySelector('#env');
  const rev = root.querySelector('#rev');
  const cv  = root.querySelector('#cv');
  let opened = false;
  const open = () => {
    if (opened) return;
    opened = true;
    env.classList.add('opening');
    setTimeout(() => {
      env.classList.add('gone');
      rev.classList.add('on');
      runMotion(cv, animId, accent);
    }, 900);
  };
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  if (autoplay) setTimeout(open, 420);
}

/* =====================================================================
   Motion
   ===================================================================== */
function shade(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const c = v => Math.max(0, Math.min(255, v));
  const r = c((n >> 16) + amt), g = c(((n >> 8) & 255) + amt), b = c((n & 255) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
class Balloon {
  constructor(x, y, c) { this.x=x; this.y=y; this.vx=(Math.random()-.5)*.4; this.vy=-(.4+Math.random()*.6);
    this.r=14+Math.random()*18; this.c=c; this.alt=Math.random()<.5; this.s=Math.random()*6.28; this.a=0; this.life=900+Math.random()*400; this.dead=false; }
  update(dt){ this.a+=dt; this.s+=.02*dt; this.x+=this.vx*dt+Math.sin(this.s)*.4; this.y+=this.vy*dt;
    if(this.y<-this.r*4||this.a>this.life) this.dead=true; }
  draw(g){ const al=Math.min(1,this.a/30)*(1-Math.max(0,(this.a-this.life+60)/60));
    g.save(); g.globalAlpha=Math.max(0,al);
    const c1=this.alt?'#F5C56A':this.c, c2=this.alt?'#B98134':shade(this.c,-20);
    const gr=g.createRadialGradient(this.x-this.r*.3,this.y-this.r*.3,this.r*.1,this.x,this.y,this.r);
    gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr;
    g.beginPath(); g.ellipse(this.x,this.y,this.r*.9,this.r,0,0,6.28); g.fill();
    g.beginPath(); g.moveTo(this.x,this.y+this.r); g.lineTo(this.x-2,this.y+this.r+4); g.lineTo(this.x+2,this.y+this.r+4); g.closePath(); g.fillStyle=c2; g.fill();
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1; g.beginPath(); g.moveTo(this.x,this.y+this.r+4);
    for(let i=0;i<20;i++) g.lineTo(this.x+Math.sin(this.s+i*.5)*3, this.y+this.r+4+i*6+Math.sin(this.s+i*.5)*3);
    g.stroke(); g.restore(); }
}
class Petal {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.8; this.vy=.3+Math.random()*.6;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.05; this.sz=8+Math.random()*10; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.03*dt; this.x+=this.vx*dt+Math.sin(this.s)*.6; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30);
    g.fillStyle=this.c; g.beginPath(); g.ellipse(0,0,this.sz,this.sz*.55,0,0,6.28); g.fill();
    g.fillStyle='rgba(255,255,255,.2)'; g.beginPath(); g.ellipse(-this.sz*.3,-this.sz*.15,this.sz*.4,this.sz*.15,0,0,6.28); g.fill(); g.restore(); }
}
class Heart {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.5; this.vy=-(.4+Math.random()*.5);
    this.sz=8+Math.random()*14; this.c=c; this.s=Math.random()*6.28; this.a=0; this.life=500+Math.random()*300; this.dead=false; }
  update(dt){ this.a+=dt; this.s+=.04*dt; this.x+=this.vx*dt+Math.sin(this.s)*.8; this.y+=this.vy*dt;
    if(this.y<-30||this.a>this.life) this.dead=true; }
  draw(g){ const f=Math.min(1,this.a/20)*Math.max(0,1-Math.max(0,this.a-this.life+60)/60);
    g.save(); g.globalAlpha=f; g.fillStyle=this.c; const s=this.sz; g.beginPath();
    g.moveTo(this.x,this.y+s*.3);
    g.bezierCurveTo(this.x,this.y-s*.3,this.x-s,this.y-s*.3,this.x-s,this.y+s*.2);
    g.bezierCurveTo(this.x-s,this.y+s*.7,this.x,this.y+s,this.x,this.y+s*1.1);
    g.bezierCurveTo(this.x,this.y+s,this.x+s,this.y+s*.7,this.x+s,this.y+s*.2);
    g.bezierCurveTo(this.x+s,this.y-s*.3,this.x,this.y-s*.3,this.x,this.y+s*.3);
    g.fill(); g.restore(); }
}
class Sparkle {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*3; this.vy=(Math.random()-.5)*3;
    this.sz=1+Math.random()*3; this.c=c; this.a=0; this.life=60+Math.random()*60; this.dead=false; }
  update(dt){ this.a+=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=.98; this.vy*=.98; if(this.a>this.life) this.dead=true; }
  draw(g){ const t=Math.max(0,1-this.a/this.life); g.save(); g.globalAlpha=t; g.fillStyle=this.c;
    g.shadowColor=this.c; g.shadowBlur=8; g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill();
    g.strokeStyle=this.c; g.lineWidth=.6; g.beginPath();
    g.moveTo(this.x-this.sz*3,this.y); g.lineTo(this.x+this.sz*3,this.y);
    g.moveTo(this.x,this.y-this.sz*3); g.lineTo(this.x,this.y+this.sz*3); g.stroke(); g.restore(); }
}
class Cloud {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=.15+Math.random()*.15; this.sz=40+Math.random()*50; this.c=c; this.a=0; this.dead=false; }
  update(dt,W){ this.a+=dt; this.x+=this.vx*dt; if(this.x-this.sz>W+20) this.dead=true; }
  draw(g){ g.save(); g.globalAlpha=Math.min(1,this.a/60)*.5; g.fillStyle=this.c; const s=this.sz;
    g.beginPath(); g.arc(this.x,this.y,s*.5,0,6.28); g.arc(this.x+s*.4,this.y-s*.1,s*.4,0,6.28);
    g.arc(this.x+s*.8,this.y,s*.5,0,6.28); g.arc(this.x+s*.4,this.y+s*.15,s*.45,0,6.28); g.fill(); g.restore(); }
}
class Bloom {
  constructor(x,y,c){ this.x=x; this.y=y; this.r=0; this.max=80+Math.random()*120; this.c=c; this.a=0; this.life=80+Math.random()*40; this.dead=false; }
  update(dt){ this.a+=dt; this.r=this.max*(1-Math.pow(1-Math.min(1,this.a/this.life),3)); if(this.a>this.life) this.dead=true; }
  draw(g){ const t=Math.max(0,1-this.a/this.life);
    const gr=g.createRadialGradient(this.x,this.y,0,this.x,this.y,Math.max(1,this.r));
    gr.addColorStop(0,this.c+'aa'); gr.addColorStop(.5,this.c+'33'); gr.addColorStop(1,this.c+'00');
    g.save(); g.globalAlpha=t; g.fillStyle=gr; g.beginPath(); g.arc(this.x,this.y,Math.max(1,this.r),0,6.28); g.fill(); g.restore(); }
}
class Rose {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.6; this.vy=.4+Math.random()*.6;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.06; this.sz=10+Math.random()*14; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.04*dt; this.x+=this.vx*dt+Math.sin(this.s)*.8; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30); g.fillStyle=this.c;
    for(let i=0;i<5;i++){ g.save(); g.rotate(i/5*6.28); g.beginPath(); g.ellipse(0,-this.sz*.6,this.sz*.5,this.sz*.7,0,0,6.28); g.fill(); g.restore(); }
    g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.arc(0,0,this.sz*.25,0,6.28); g.fill(); g.restore(); }
}
class Leaf {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.6; this.vy=.3+Math.random()*.5;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.04; this.sz=10+Math.random()*10; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.03*dt; this.x+=this.vx*dt+Math.sin(this.s)*.9; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30); g.fillStyle=this.c;
    g.beginPath(); g.moveTo(0,-this.sz);
    g.bezierCurveTo(this.sz*.8,-this.sz*.4,this.sz*.6,this.sz*.6,0,this.sz);
    g.bezierCurveTo(-this.sz*.6,this.sz*.6,-this.sz*.8,-this.sz*.4,0,-this.sz); g.fill();
    g.strokeStyle='rgba(0,0,0,.15)'; g.lineWidth=1; g.beginPath(); g.moveTo(0,-this.sz); g.lineTo(0,this.sz); g.stroke(); g.restore(); }
}
class Star {
  constructor(x,y,c){ this.x=x; this.y=y; this.base=.3+Math.random()*.7; this.ph=Math.random()*6.28; this.sz=.6+Math.random()*2; this.c=c; this.dead=false; }
  update(dt){ this.ph+=.05*dt; }
  draw(g){ g.save(); g.globalAlpha=this.base*(.5+.5*Math.sin(this.ph)); g.fillStyle=this.c;
    g.shadowColor=this.c; g.shadowBlur=6; g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill(); g.restore(); }
}
class Confetti {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*2.4; this.vy=-(1.5+Math.random()*2.5);
    this.w=4+Math.random()*6; this.h=7+Math.random()*8; this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.3;
    this.c=[c,'#F5C56A','#E85A7C','#7DC49B','#B4C9D6'][(Math.random()*5)|0]; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.vy+=.055*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+30) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/12);
    g.fillStyle=this.c; g.fillRect(-this.w/2,-this.h/2,this.w,this.h); g.restore(); }
}

class Bubble {
  constructor(x,y,c){ this.x=x; this.y=y; this.vy=-(.3+Math.random()*.7); this.sz=6+Math.random()*18; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.03*dt; this.x+=Math.sin(this.s)*.5; this.y+=this.vy*dt; if(this.y<-this.sz*2) this.dead=true; }
  draw(g){ g.save(); g.globalAlpha=Math.min(1,this.a/30)*.55; g.strokeStyle=this.c; g.lineWidth=1.4;
    g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.stroke();
    g.fillStyle='rgba(255,255,255,.28)'; g.beginPath(); g.arc(this.x-this.sz*.35,this.y-this.sz*.35,this.sz*.28,0,6.28); g.fill(); g.restore(); }
}
class Firefly {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.5; this.vy=(Math.random()-.5)*.5; this.sz=1.4+Math.random()*2.2; this.c=c; this.ph=Math.random()*6.28; this.dead=false; }
  update(dt,W,H){ this.ph+=.06*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.x<0||this.x>W) this.vx*=-1; if(this.y<0||this.y>H) this.vy*=-1; }
  draw(g){ g.save(); g.globalAlpha=.3+.5*Math.max(0,Math.sin(this.ph)); g.fillStyle=this.c; g.shadowColor=this.c; g.shadowBlur=12;
    g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill(); g.restore(); }
}
class Snow {
  constructor(x,y,c){ this.x=x; this.y=y; this.vy=.3+Math.random()*.5; this.sz=1.5+Math.random()*3.5; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.02*dt; this.x+=Math.sin(this.s)*.5; this.y+=this.vy*dt; if(this.y>H+10) this.dead=true; }
  draw(g){ g.save(); g.globalAlpha=Math.min(1,this.a/30)*.85; g.fillStyle='#ffffff';
    g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill(); g.restore(); }
}

function emitters(type) {
  const drip = (P,W,H,c,dt,rate,make) => { if (Math.random() < rate*dt) P.push(make(W,H,c)); };
  const map = {
    balloons:{ burst:(P,W,H,c)=>{for(let i=0;i<8;i++)P.push(new Balloon(Math.random()*W,H+Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.08,()=>new Balloon(Math.random()*W,H+30,c)) },
    petals:{   burst:(P,W,H,c)=>{for(let i=0;i<20;i++)P.push(new Petal(Math.random()*W,Math.random()*H*.5-40,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.25,()=>new Petal(Math.random()*W,-20,c)) },
    hearts:{   burst:(P,W,H,c)=>{for(let i=0;i<6;i++)P.push(new Heart(W/2+(Math.random()-.5)*80,H*.7+Math.random()*40,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.15,()=>new Heart(Math.random()*W,H+20,c)) },
    sparkles:{ burst:(P,W,H,c)=>{for(let i=0;i<40;i++)P.push(new Sparkle(W/2+(Math.random()-.5)*200,H/2+(Math.random()-.5)*200,c));},
               emit:(P,W,H,c,dt)=>{ if(Math.random()<.5*dt) for(let i=0;i<3;i++) P.push(new Sparkle(Math.random()*W,Math.random()*H,c)); } },
    clouds:{   burst:(P,W,H,c)=>{for(let i=0;i<3;i++)P.push(new Cloud(Math.random()*W-100,Math.random()*H*.6+50,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.005,()=>new Cloud(-80,Math.random()*H*.6+40,c)) },
    bloom:{    burst:(P,W,H,c)=>{P.push(new Bloom(W/2,H/2,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.008,()=>new Bloom(Math.random()*W,Math.random()*H,c)) },
    roses:{    burst:(P,W,H,c)=>{for(let i=0;i<10;i++)P.push(new Rose(Math.random()*W,-Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.12,()=>new Rose(Math.random()*W,-20,c)) },
    leaves:{   burst:(P,W,H,c)=>{for(let i=0;i<8;i++)P.push(new Leaf(Math.random()*W,-Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.12,()=>new Leaf(Math.random()*W,-20,c)) },
    stars:{    burst:(P,W,H,c)=>{for(let i=0;i<120;i++)P.push(new Star(Math.random()*W,Math.random()*H,c));},
               emit:()=>{} },
    confetti:{ burst:(P,W,H,c)=>{for(let i=0;i<70;i++)P.push(new Confetti(W/2+(Math.random()-.5)*W*.5,H*.55,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.10,()=>new Confetti(Math.random()*W,-20,c)) },
    bubbles:{  burst:(P,W,H,c)=>{for(let i=0;i<14;i++)P.push(new Bubble(Math.random()*W,H+Math.random()*80,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.14,()=>new Bubble(Math.random()*W,H+20,c)) },
    fireflies:{burst:(P,W,H,c)=>{for(let i=0;i<50;i++)P.push(new Firefly(Math.random()*W,Math.random()*H,c));},
               emit:()=>{} },
    snow:{     burst:(P,W,H,c)=>{for(let i=0;i<60;i++)P.push(new Snow(Math.random()*W,Math.random()*H,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.4,()=>new Snow(Math.random()*W,-10,c)) },
  };
  return map[type] || map.sparkles;
}

function runMotion(canvas, animId, accent) {
  if (!canvas) return;
  const g = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const fit = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  window.addEventListener('resize', fit);
  const W = () => canvas.clientWidth, H = () => canvas.clientHeight;
  const P = [], em = emitters(animId);
  em.burst && em.burst(P, W(), H(), accent);
  let last = performance.now();
  const started = last;
  (function frame(now) {
    const dt = Math.min(40, now - last) / 16.67;
    last = now;
    if (em.emit) em.emit(P, W(), H(), accent, dt);
    g.clearRect(0, 0, W(), H());
    for (let i = P.length - 1; i >= 0; i--) {
      P[i].update(dt, W(), H());
      if (P[i].dead) { P.splice(i, 1); continue; }
      P[i].draw(g);
    }
    if (now - started < 90000) requestAnimationFrame(frame);
  })(last);
}

// Serialised into the preview iframe.
const MOTION_SRC = () => [shade, Balloon, Petal, Heart, Sparkle, Cloud, Bloom,
  Rose, Leaf, Star, Confetti, Bubble, Firefly, Snow, emitters, runMotion].map(f => f.toString()).join('\n');

/* =====================================================================
   Router
   ===================================================================== */
const HOME = () => location.origin + location.pathname;

async function boot() {
  try {
    const t = localStorage.getItem('baaqa.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch {}

  document.querySelectorAll('.recipient, .scanview').forEach(n => n.remove());
  document.body.style.background = '';

  const h = location.hash;

  if (CODEC.carriesCard(location.search, h)) {
    const card = await CODEC.readCard(location.search, h);
    if (card) { renderRecipient(card); return; }
    toast('رابط الكرت غير صالح');
  }
  if (h.startsWith('#e/')) {
    const card = loadCards().find(c => c.id === h.slice(3));
    if (card) { await renderExport(card); return; }
  }
  if (h === '#x' && EXPORT_CARD) { await renderExport(EXPORT_CARD); return; }
  if (h === '#sheet') { await renderSheet(); return; }

  state.customerMode = (h === '#new');
  renderComposer();
}

window.addEventListener('hashchange', boot);
boot();
</script>
