<style>
:root {
  --bg: #F6EFE7;
  --surface: #FFFFFF;
  --surface-2: #FBF6EF;
  --ink: #1F1512;
  --ink-2: #4A362E;
  --muted: #8B7168;
  --line: rgba(31,21,18,0.10);
  --line-2: rgba(31,21,18,0.18);
  --accent: #742036;
  --blush: #E8B4A7;
  --gold: #B08549;
  --ok: #2F6B4A;
  --warn: #9A6218;
  --shadow-sm: 0 1px 2px rgba(31,21,18,0.06), 0 4px 12px rgba(31,21,18,0.04);
  --shadow-md: 0 4px 12px rgba(31,21,18,0.08), 0 20px 40px rgba(31,21,18,0.08);
  --radius: 14px;
  --font-display: "Amiri", "Times New Roman", serif;
  --font-ui: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-eyebrow: "Reem Kufi", "Tajawal", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160B0E; --surface: #22141A; --surface-2: #2A1A20;
    --ink: #F0E6DD; --ink-2: #D6C7BB; --muted: #96827A;
    --line: rgba(240,230,221,0.10); --line-2: rgba(240,230,221,0.18);
    --accent: #C94664; --blush: #E8B4A7; --gold: #D4A76A;
    --ok: #5FB58A; --warn: #E0A94A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #160B0E; --surface: #22141A; --surface-2: #2A1A20;
  --ink: #F0E6DD; --ink-2: #D6C7BB; --muted: #96827A;
  --line: rgba(240,230,221,0.10); --line-2: rgba(240,230,221,0.18);
  --accent: #C94664; --blush: #E8B4A7; --gold: #D4A76A;
  --ok: #5FB58A; --warn: #E0A94A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { direction: rtl; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- top bar ---------- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
}
.chrome-inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
}
.logo-mark {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--blush), var(--accent) 70%);
  position: relative; flex-shrink: 0;
}
.logo-mark::after {
  content: ""; position: absolute; inset: 6px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
}
.logo small {
  font-family: var(--font-eyebrow); font-size: 9px; font-weight: 500;
  letter-spacing: .16em; color: var(--muted); text-transform: uppercase;
  display: block; margin-top: -3px;
}
.chrome-spacer { flex: 1; }
.chrome-act { display: flex; gap: 6px; align-items: center; }
.tab {
  padding: 7px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  transition: color .15s, background .15s;
}
.tab:hover { color: var(--ink); }
.tab.active { background: var(--ink); color: var(--bg); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted);
  border: 1px solid var(--line-2);
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- layout ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 26px 22px 80px; }
.eyebrow {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .22em;
  color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
}
h1.title {
  font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px);
  line-height: 1.15; margin: 0 0 8px; font-weight: 700; text-wrap: balance;
}
h1.title em { color: var(--accent); font-style: italic; font-weight: 400; }
.sub { color: var(--muted); max-width: 62ch; margin: 0; }
.hero-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.hero-badges span {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .06em; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  display: inline-flex; align-items: center; gap: 6px;
}
.hero-badges span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }

.edit-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding: 11px 16px; border-radius: 12px;
  background: color-mix(in oklab, var(--accent) 8%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--accent) 24%, transparent);
  font-size: 13px; color: var(--ink-2);
}
.edit-banner b { font-family: var(--font-display); color: var(--accent); font-weight: 700; }
.edit-banner button {
  margin-inline-start: auto; padding: 7px 14px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink); font-size: 12.5px;
}
.edit-banner button:hover { border-color: var(--ink); }

.composer {
  display: grid; grid-template-columns: 1.08fr 0.92fr;
  gap: 24px; margin-top: 26px; align-items: start;
}
@media (max-width: 940px) { .composer { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
}
.panel + .panel { margin-top: 16px; }
.panel-title {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .18em;
  color: var(--muted); text-transform: uppercase; margin: 0 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.panel-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* preset gallery */
.presets { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; }
.presets::-webkit-scrollbar { height: 6px; }
.presets::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.preset {
  flex: 0 0 auto; width: 96px; scroll-snap-align: start;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: var(--surface-2); transition: transform .15s, border-color .15s, box-shadow .15s;
}
.preset:hover { transform: translateY(-2px); border-color: var(--line-2); }
.preset.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent); }
.preset-swatch {
  height: 66px; display: grid; place-items: center; position: relative;
  background: radial-gradient(120% 90% at 50% 12%, color-mix(in oklab, var(--pacc) 42%, var(--pbg)), var(--pbg) 76%);
}
.preset-swatch i {
  width: 9px; height: 9px; transform: rotate(45deg); background: var(--pacc);
  box-shadow: 0 0 14px color-mix(in oklab, var(--pacc) 70%, transparent);
}
.preset-name {
  display: block; text-align: center; font-size: 11.5px; padding: 7px 4px;
  font-family: var(--font-display); color: var(--ink);
}

/* bulk names textarea + generic modal textarea */
.modal textarea {
  width: 100%; min-height: 130px; resize: vertical; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; color: var(--ink);
  font-family: var(--font-display); font-size: 16px; line-height: 1.9; margin-top: 8px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.modal .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.modal .check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* onboarding banner */
.intro {
  margin-top: 20px; padding: 18px 20px; border-radius: 16px; position: relative;
  background: linear-gradient(120deg, color-mix(in oklab, var(--accent) 12%, var(--surface)), var(--surface));
  border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
}
.intro h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 12px; }
.intro-steps { display: flex; gap: 14px; flex-wrap: wrap; }
.intro-step { display: flex; align-items: flex-start; gap: 10px; flex: 1 1 200px; }
.intro-num {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; font-family: var(--font-eyebrow);
}
.intro-step b { display: block; font-size: 13.5px; }
.intro-step span { font-size: 12px; color: var(--muted); }
.intro-close {
  position: absolute; top: 12px; inset-inline-end: 12px; width: 26px; height: 26px;
  border-radius: 50%; color: var(--muted); border: 1px solid var(--line-2); display: grid; place-items: center;
}
.intro-close:hover { color: var(--ink); border-color: var(--ink); }

/* button loading state + spinner */
.btn[disabled] { opacity: .7; pointer-events: none; }
.spin {
  width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent;
  border-radius: 50%; display: inline-block; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* occasion grid */
.occasions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
@media (max-width: 560px) { .occasions { grid-template-columns: repeat(3, 1fr); } }
.occ {
  min-height: 46px; padding: 12px 8px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface-2); display: grid; place-items: center;
  transition: transform .15s, border-color .15s, background .15s;
}
.occ:hover { transform: translateY(-2px); border-color: var(--line-2); }
.occ.on {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent);
}
.occ .l { font-family: var(--font-display); font-size: 15px; font-weight: 400; color: var(--ink); }

/* fields */
.field { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
label.lbl {
  display: block; font-size: 10px; font-weight: 500; color: var(--muted);
  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px;
  font-family: var(--font-eyebrow);
}
.field input, .field textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 13px; color: var(--ink);
  transition: border-color .15s, background .15s;
}
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); background: var(--surface);
}
.field textarea {
  min-height: 110px; resize: vertical;
  font-family: var(--font-display); font-size: 17px; line-height: 1.7;
}
.hint {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 6px; font-size: 11px; color: var(--muted);
  font-family: var(--font-eyebrow); letter-spacing: .05em;
}
.hint b { color: var(--ink-2); font-weight: 500; }

/* option chips */
.opt-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 12.5px; color: var(--ink-2);
  transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
}
.chip:hover { border-color: var(--line-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw {
  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
}
.opt-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
.yt-prev { margin-top: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; }
.yt-prev iframe { display: block; width: 100%; height: 100%; border: 0; }

/* preview */
.sticky { position: sticky; top: 88px; }
.phone {
  aspect-ratio: 9 / 16; max-height: 600px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; overflow: hidden; position: relative;
  box-shadow: var(--shadow-md);
}
.phone::before {
  content: ""; position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%); width: 40px; height: 4px; border-radius: 2px;
  background: color-mix(in oklab, var(--ink) 15%, transparent); z-index: 10;
}
.phone iframe { width: 100%; height: 100%; border: 0; background: var(--surface); }

.btn {
  padding: 11px 17px; border-radius: 10px; font-size: 14px; font-weight: 500;
  transition: transform .1s, background .15s; display: inline-flex;
  align-items: center; gap: 8px; justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--bg); flex: 1; }
.btn-primary:hover { background: var(--accent); }
.btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-2); }
.btn-secondary:hover { border-color: var(--ink); }
.row { display: flex; gap: 9px; flex-wrap: wrap; }
.row .btn { flex: 1 1 auto; }

/* result */
.result {
  display: none; margin-top: 28px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 20px; padding: 26px;
  box-shadow: var(--shadow-md); animation: fadeUp .45s ease;
}
.result.on { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
@media (max-width: 660px) { .result.on { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.qr-wrap {
  background: #fff; padding: 16px; border-radius: 14px;
  border: 1px solid var(--line); display: inline-block;
}
.qr-wrap svg { display: block; width: 210px; height: 210px; }
.result h3 { font-family: var(--font-display); font-size: 25px; margin: 0 0 6px; }
.result p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.linkbox {
  display: flex; align-items: center; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 4px 4px 4px 12px; overflow: hidden; width: 100%;
}
.linkbox input {
  flex: 1; background: transparent; border: 0; padding: 8px 4px;
  color: var(--ink-2); font-size: 12px; min-width: 0;
  direction: ltr; text-align: left;
}
.linkbox button {
  padding: 8px 14px; border-radius: 8px; background: var(--ink);
  color: var(--bg); font-size: 12px; font-weight: 500; flex-shrink: 0;
}
.density {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .08em;
  color: var(--muted);
}
.density .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.density.mid .dot { background: var(--warn); }

/* gallery */
.gallery { margin-top: 44px; }
.gallery-head {
  display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px;
}
.gallery-head h2 { font-family: var(--font-display); font-size: 23px; margin: 0; }
.gallery-head span { color: var(--muted); font-size: 13px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 13px; }
.gcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px; transition: transform .15s, border-color .15s; position: relative;
}
.gcard:hover { transform: translateY(-2px); border-color: var(--line-2); }
.gcard-tag {
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 5px;
}
.gcard-to { font-family: var(--font-display); font-size: 18px; margin: 0 0 3px; }
.gcard-msg {
  font-size: 12.5px; color: var(--muted); min-height: 34px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.gcard-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line);
  font-size: 11px; color: var(--muted);
  font-family: var(--font-eyebrow); letter-spacing: .08em;
}
.gcard-meta button { color: var(--muted); font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.gcard-meta button:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
.empty {
  padding: 38px 20px; text-align: center; color: var(--muted);
  background: var(--surface-2); border: 1px dashed var(--line-2);
  border-radius: 14px; font-family: var(--font-display); font-size: 16px;
}

/* ======================= RECIPIENT ======================= */
.recipient {
  position: fixed; inset: 0; background: var(--rec-bg, #1a0d10);
  color: var(--rec-ink, #f8ecd8); overflow: hidden; z-index: 100; display: none;
}
.recipient.on { display: block; }
.rec-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.rec-stage {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; perspective: 1400px; z-index: 2;
}
.envelope {
  width: min(86vw, 400px); aspect-ratio: 3 / 2; position: relative;
  transform-style: preserve-3d; cursor: pointer;
  transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .8s;
}
.env-body {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #f6e6c9, #e6cfa8); border-radius: 6px;
  box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.35),
              inset 0 0 0 1px rgba(255,255,255,.35);
}
.env-flap {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, #eed7ac, #d8ba82);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center; transform: rotateX(0deg);
  transition: transform 1s cubic-bezier(.6,.05,.3,1);
  box-shadow: inset 0 -6px 12px rgba(0,0,0,.12); z-index: 3;
}
.envelope.opening .env-flap { transform: rotateX(180deg); z-index: 1; }
.envelope.opening .env-inner { transform: translateY(-58%) scale(1); opacity: 1; }
.envelope.opening { transform: translateY(-30%) scale(1.05); }
.envelope.gone { opacity: 0; transform: translateY(-60%) scale(.9); pointer-events: none; }
.env-inner {
  position: absolute; left: 8%; right: 8%; top: 15%; bottom: 15%;
  background: linear-gradient(180deg, #fdfaf3, #f5ecd8); border-radius: 4px;
  z-index: 2; transform: translateY(0) scale(.98); opacity: .9;
  transition: transform 1.2s cubic-bezier(.2,.7,.2,1) .3s, opacity 1s .3s;
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.env-inner-mark { font-family: var(--font-display); font-size: 46px; color: var(--rec-accent); opacity: .55; }
.env-seal {
  position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  width: 72px; height: 72px; z-index: 4; transition: transform .5s, opacity .5s;
}
.envelope.opening .env-seal { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
.env-seal-circle {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #a83143, var(--rec-accent, #742036) 70%, #4b0f1f);
  box-shadow: inset -4px -6px 10px rgba(0,0,0,.5), inset 3px 4px 8px rgba(255,255,255,.15),
              0 4px 12px rgba(0,0,0,.4);
  display: grid; place-items: center; color: rgba(255,255,255,.85);
  font-family: var(--font-display); font-weight: 700; font-size: 25px; position: relative;
}
.env-seal-circle::before {
  content: ""; position: absolute; inset: 6px;
  border: 1px dashed rgba(255,255,255,.4); border-radius: 50%;
}
.env-hint {
  position: absolute; bottom: 7%; left: 0; right: 0; text-align: center;
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .28em;
  color: rgba(255,255,255,.55); text-transform: uppercase;
  animation: pulseUp 2.2s ease-in-out infinite; z-index: 5;
}
@keyframes pulseUp {
  0%,100% { transform: translateY(0); opacity: .5; }
  50% { transform: translateY(-6px); opacity: .95; }
}
.reveal {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 64px 24px 72px;
  opacity: 0; pointer-events: none; transition: opacity 1s ease .3s;
  z-index: 3; overflow-y: auto;
}
.reveal.on { opacity: 1; pointer-events: auto; }
.reveal-inner { max-width: 560px; width: 100%; text-align: center; }
.reveal-eyebrow {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--rec-accent); margin-bottom: 8px;
  opacity: 0; animation: rise 1s ease .8s forwards;
}
.reveal-to {
  font-family: var(--rec-font, var(--font-display)); font-size: clamp(21px, 4.4vw, 31px);
  margin: 0 0 22px; opacity: 0; animation: rise 1s ease 1.1s forwards;
}
/* A drawn ornament (a small diamond flanked by hairlines) replaces the old
   emoji dingbat. Each card style restyles or hides it. */
.reveal-orn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin: 0 auto 20px; opacity: 0; animation: rise 1s ease 1s forwards;
}
.reveal-orn i { display: block; width: 44px; height: 1px; background: var(--rec-accent); opacity: .55; }
.reveal-orn b { display: block; width: 6px; height: 6px; transform: rotate(45deg);
  background: var(--rec-accent); }
/* Monogram: the recipient's initial, drawn, used by some styles. */
.reveal-mono {
  width: 74px; height: 74px; margin: 0 auto 20px; border-radius: 50%;
  border: 1px solid var(--rec-accent); display: grid; place-items: center;
  font-family: var(--rec-font, var(--font-display)); font-size: 34px;
  color: var(--rec-accent); opacity: 0; animation: rise 1s ease .7s forwards;
}
.reveal-mono span { line-height: 1; }
.reveal-msg {
  font-family: var(--rec-font, var(--font-display));
  font-size: clamp(20px, 3.4vw, 28px); line-height: 1.75;
  color: var(--rec-ink); margin: 0 0 28px; text-wrap: balance;
  white-space: pre-wrap; opacity: 0; animation: rise 1.4s ease 1.4s forwards;
}
.reveal-sig {
  display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
  opacity: 0; animation: rise 1s ease 2s forwards;
}
.reveal-sig-line { width: 50px; height: 1px; background: var(--rec-accent); opacity: .6; }
.reveal-sig-from {
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .26em;
  color: var(--rec-accent); text-transform: uppercase; margin: 3px 0 2px; opacity: .75;
}
.reveal-sig-name { font-family: var(--rec-font, var(--font-display)); font-size: 20px; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* =========================================================================
   Card styles — distinct reveal treatments, selectable per card. The default
   (classic) needs no attribute. Each hides the ornaments it does not use.
   ========================================================================= */

/* Classic: centered editorial, drawn diamond ornament, monogram hidden. */
.reveal[data-style="classic"] .reveal-mono { display: none; }

/* Minimal: gallery-airy. No ornament, a hairline Latin eyebrow, a large light
   message, everything quiet. */
.reveal[data-style="minimal"] .reveal-orn,
.reveal[data-style="minimal"] .reveal-mono { display: none; }
.reveal[data-style="minimal"] .reveal-eyebrow { letter-spacing: .42em; opacity: .7; }
.reveal[data-style="minimal"] .reveal-to { font-weight: 400; font-style: normal; margin-bottom: 30px; }
.reveal[data-style="minimal"] .reveal-msg { font-size: clamp(22px, 3.8vw, 30px); font-weight: 400; line-height: 1.9; }
.reveal[data-style="minimal"] .reveal-sig-line { display: none; }

/* Editorial: right-aligned, a heavy accent rule down the start edge, the name
   large as the anchor, the message in a narrower measure. */
.reveal[data-style="editorial"] { align-items: stretch; }
.reveal[data-style="editorial"] .reveal-inner { text-align: start; max-width: 620px; }
.reveal[data-style="editorial"] .reveal-mono { display: none; }
.reveal[data-style="editorial"] .reveal-orn { justify-content: flex-start; margin-inline-start: 2px; }
.reveal[data-style="editorial"] .reveal-orn i { width: 30px; }
.reveal[data-style="editorial"] .reveal-eyebrow { margin-inline-start: 2px; }
.reveal[data-style="editorial"] .reveal-to {
  font-size: clamp(30px, 8vw, 52px); line-height: 1.05; margin-bottom: 26px;
  padding-inline-start: 16px; border-inline-start: 3px solid var(--rec-accent);
}
.reveal[data-style="editorial"] .reveal-msg { max-width: 46ch; margin-inline: 0; }
.reveal[data-style="editorial"] .reveal-sig { align-items: flex-start; }

/* Monogram: a drawn ring holds the recipient's initial; formal and centered
   with a hairline frame around the whole message. */
.reveal[data-style="monogram"] .reveal-orn { display: none; }
.reveal[data-style="monogram"] .reveal-inner {
  border: 1px solid color-mix(in oklab, var(--rec-accent) 45%, transparent);
  border-radius: 4px; padding: 40px 30px 34px; max-width: 500px;
}
.reveal[data-style="monogram"] .reveal-eyebrow { margin-top: 4px; }
.reveal[data-style="monogram"] .reveal-msg { font-size: clamp(19px, 3.2vw, 26px); }

/* Aurora: a soft radial glow of the accent behind clean centered type — the
   modern social-story look. */
.reveal[data-style="aurora"] { background:
  radial-gradient(60% 50% at 50% 34%, color-mix(in oklab, var(--rec-accent) 34%, transparent), transparent 70%),
  radial-gradient(70% 60% at 50% 88%, color-mix(in oklab, var(--rec-accent) 16%, transparent), transparent 72%); }
.reveal[data-style="aurora"] .reveal-mono {
  border: 0; background: color-mix(in oklab, var(--rec-accent) 22%, transparent);
  color: var(--rec-ink); backdrop-filter: blur(4px);
}
.reveal[data-style="aurora"] .reveal-orn { display: none; }
.reveal[data-style="aurora"] .reveal-to { font-style: normal; }
.reveal[data-style="aurora"] .reveal-msg { font-size: clamp(21px, 3.6vw, 29px); }
.reveal[data-style="aurora"] .reveal-sig-line { display: none; }

/* Noir: stark monochrome, everything in the ink colour, the accent reduced to a
   single long hairline. High-fashion and restrained. */
.reveal[data-style="noir"] .reveal-mono { display: none; }
.reveal[data-style="noir"] .reveal-orn i { width: 64px; opacity: .3; }
.reveal[data-style="noir"] .reveal-orn b { background: var(--rec-ink); opacity: .5; }
.reveal[data-style="noir"] .reveal-eyebrow { color: var(--rec-ink); opacity: .55; letter-spacing: .5em; }
.reveal[data-style="noir"] .reveal-to { font-weight: 400; font-style: normal; letter-spacing: .02em; }
.reveal[data-style="noir"] .reveal-msg { font-weight: 400; }
.reveal[data-style="noir"] .reveal-sig-from,
.reveal[data-style="noir"] .reveal-sig-name { color: var(--rec-ink); }
.reveal[data-style="noir"] .reveal-sig-line { background: var(--rec-ink); }

/* Stamp: a postage look — a solid frame ringed by a dashed perforation, the
   monogram tilted like a postmark. */
.reveal[data-style="stamp"] .reveal-orn { display: none; }
.reveal[data-style="stamp"] .reveal-inner {
  border: 2px solid var(--rec-accent);
  outline: 2px dashed color-mix(in oklab, var(--rec-accent) 55%, transparent);
  outline-offset: 7px; border-radius: 2px; padding: 40px 30px 34px; max-width: 470px;
  background: color-mix(in oklab, var(--rec-accent) 6%, transparent);
}
.reveal[data-style="stamp"] .reveal-mono { width: 66px; height: 66px; border-width: 2px; font-size: 30px; }
.reveal[data-style="stamp"] .reveal-mono span { display: block; transform: rotate(-8deg); }
.reveal[data-style="stamp"] .reveal-msg { font-size: clamp(19px, 3.2vw, 26px); }

/* Wave: content anchored low over a soft accent horizon rising from the base. */
.reveal[data-style="wave"] {
  justify-content: flex-end; padding-bottom: 13vh;
  background: radial-gradient(130% 62% at 50% 122%, color-mix(in oklab, var(--rec-accent) 32%, transparent), transparent 70%);
}
.reveal[data-style="wave"] .reveal-orn { display: none; }
.reveal[data-style="wave"] .reveal-mono {
  border: 0; background: color-mix(in oklab, var(--rec-accent) 20%, transparent); color: var(--rec-ink);
}
.reveal[data-style="wave"] .reveal-to { font-style: normal; }
.reveal[data-style="wave"] .reveal-sig-line { display: none; }

.rec-brand {
  position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; z-index: 5;
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .3em;
  text-transform: uppercase; color: rgba(255,255,255,.32); pointer-events: none;
}
.rec-brand strong {
  font-family: var(--font-display); font-weight: 700;
  color: rgba(255,255,255,.55); letter-spacing: .06em; font-size: 13px; margin-inline-start: 6px;
}
.rec-back {
  position: absolute; top: 16px; inset-inline-end: 16px; z-index: 6;
  padding: 7px 13px; border-radius: 999px; font-size: 12px;
  background: rgba(0,0,0,.35); color: rgba(255,255,255,.75);
  backdrop-filter: blur(8px);
}
.rec-back:hover { background: rgba(0,0,0,.55); color: #fff; }
/* The YouTube audio player: kept in the DOM and rendered (so it keeps playing)
   but visually hidden — the song is what matters, not the video. */
.yt-embed {
  position: fixed; inset-inline-start: 10px; bottom: 10px;
  width: 180px; height: 101px; opacity: 0; pointer-events: none;
  z-index: 1; overflow: hidden; border: 0;
}
.yt-embed iframe { width: 100%; height: 100%; border: 0; }
.rec-music {
  position: fixed; bottom: 16px; inset-inline-start: 16px; z-index: 7;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: 999px; font-size: 12px;
  background: rgba(0,0,0,.4); color: rgba(255,255,255,.85);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-family: var(--font-eyebrow); letter-spacing: .04em;
}
.rec-music:hover { background: rgba(0,0,0,.6); color: #fff; }
.rec-music svg { flex-shrink: 0; }
.rec-vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,.34) 92%);
}

/* Scratch-to-reveal: the message sits ready underneath; a gold foil painted on a
   canvas is erased with the finger. `instant` shows the content with no entrance
   animation so scratching uncovers the final text directly. */
.reveal.instant .reveal-eyebrow,
.reveal.instant .reveal-orn,
.reveal.instant .reveal-mono,
.reveal.instant .reveal-to,
.reveal.instant .reveal-msg,
.reveal.instant .reveal-sig { animation: none; opacity: 1; transform: none; }
.scratch {
  position: fixed; inset: 0; z-index: 5; touch-action: none; cursor: grab;
  /* Pin the CSS box to the viewport so the canvas `width`/`height` attributes
     (its backing-store size) do not become its layout size — under RTL that
     anchored it right and pushed it off-screen left. */
  width: 100vw; height: 100vh;
}
.scratch.gone { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
.scratch-hint {
  position: fixed; top: 50%; left: 0; right: 0; z-index: 6; text-align: center;
  transform: translateY(-50%); pointer-events: none; transition: opacity .3s;
  color: rgba(70,45,10,.72); font-family: var(--font-eyebrow);
  letter-spacing: .28em; font-size: 13px; text-transform: uppercase;
  animation: pulseUp 2.2s ease-in-out infinite;
}

/* Scheduled reveal: a countdown holds the card shut until its moment. */
.countdown { text-align: center; color: var(--rec-ink); max-width: 560px; padding: 0 24px; }
.cd-mono {
  width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 50%;
  border: 1px solid var(--rec-accent); display: grid; place-items: center;
  font-family: var(--rec-font, var(--font-display)); font-size: 34px; color: var(--rec-accent);
}
.cd-mono span { line-height: 1; }
.cd-eyebrow {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--rec-accent); margin-bottom: 6px;
}
.cd-to { font-family: var(--rec-font, var(--font-display)); font-size: clamp(22px, 5vw, 34px); margin: 6px 0 20px; }
.cd-label {
  font-family: var(--font-eyebrow); letter-spacing: .3em; font-size: 11px;
  text-transform: uppercase; color: var(--rec-accent); opacity: .8; margin-bottom: 16px;
}
.cd-timer { display: flex; gap: 12px; justify-content: center; direction: ltr; }
.cd-u { display: flex; flex-direction: column; align-items: center; min-width: 58px; }
.cd-u b {
  font-family: var(--rec-font, var(--font-display)); font-weight: 700; line-height: 1;
  font-size: clamp(26px, 7vw, 44px); width: 100%; padding: 12px 6px; border-radius: 12px;
  background: color-mix(in oklab, var(--rec-accent) 15%, transparent);
  border: 1px solid color-mix(in oklab, var(--rec-accent) 40%, transparent);
}
.cd-u i { font-style: normal; font-family: var(--font-eyebrow); font-size: 10px;
  letter-spacing: .1em; color: var(--rec-accent); margin-top: 9px; }
.cd-date { margin-top: 22px; font-size: 12px; color: color-mix(in oklab, var(--rec-ink) 55%, transparent);
  font-family: var(--font-eyebrow); letter-spacing: .06em; }

/* Full-screen symbol for scanning off a display */
.scanview {
  position: fixed; inset: 0; z-index: 300; background: #ffffff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px; gap: 14px;
}
.scanview-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.scanview svg {
  display: block; width: min(86vw, 86vh, 620px); height: auto;
  image-rendering: pixelated;
}
.scanview-note {
  font-family: "Tajawal", system-ui, sans-serif; font-size: 13px;
  color: #4A362E; text-align: center;
}
.scanview-close {
  position: fixed; top: 14px; inset-inline-end: 14px;
  padding: 9px 16px; border-radius: 999px; font-size: 13px;
  background: #1F1512; color: #F6EFE7;
}

.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 20px;
  border-radius: 999px; font-size: 13px; z-index: 400; opacity: 0;
  transition: opacity .2s; box-shadow: var(--shadow-md); pointer-events: none;
}
.toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .env-hint { animation: none; }
}

/* ======================= EXPORT ======================= */
.export-page { min-height: 100vh; background: var(--bg); padding-bottom: 56px; }
.export-head {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line); padding: 12px 22px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.export-head h1 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; }
.export-head h1 small {
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .18em;
  color: var(--muted); text-transform: uppercase; display: block; font-weight: 500; margin-top: 1px;
}
.export-acts { margin-inline-start: auto; display: flex; gap: 7px; flex-wrap: wrap; }
.export-acts .btn { padding: 9px 15px; font-size: 13px; flex: 0 0 auto; }
@media (max-width: 700px) {
  .export-head { align-items: flex-start; }
  .export-acts { margin-inline-start: 0; width: 100%; }
  .export-acts .btn { flex: 1 1 auto; }
}
.export-body {
  max-width: 1280px; margin: 0 auto; padding: 24px 22px;
  display: grid; grid-template-columns: 290px 1fr; gap: 24px; align-items: start;
}
@media (max-width: 940px) { .export-body { grid-template-columns: 1fr; } }
.export-side { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 940px) { .export-side { position: static; } }
.tpl-list { display: flex; flex-direction: column; gap: 6px; }
.tpl {
  display: flex; align-items: center; gap: 11px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
  text-align: start; transition: all .15s; width: 100%;
}
.tpl:hover { border-color: var(--line-2); }
.tpl.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.tpl-ic {
  width: 30px; height: 30px; border-radius: 6px; background: var(--ink);
  color: var(--bg); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 13px; flex-shrink: 0;
}
.tpl.on .tpl-ic { background: var(--accent); }
.tpl-nm { font-size: 13.5px; font-weight: 500; display: block; }
.tpl-ds {
  font-size: 10.5px; color: var(--muted); font-family: var(--font-eyebrow);
  letter-spacing: .06em; display: block; margin-top: 1px;
}
.meta { display: flex; flex-direction: column; }
.meta-row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line);
}
.meta-row:last-child { border-bottom: 0; }
.meta-row span:first-child {
  color: var(--muted); font-family: var(--font-eyebrow);
  letter-spacing: .1em; text-transform: uppercase; font-size: 10px;
}
.meta-row span:last-child { font-weight: 500; }
.stage {
  min-height: 460px; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 34px; display: flex; align-items: center; justify-content: center;
  background:
    linear-gradient(45deg, color-mix(in oklab, var(--ink) 4%, transparent) 25%, transparent 25%),
    linear-gradient(-45deg, color-mix(in oklab, var(--ink) 4%, transparent) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, color-mix(in oklab, var(--ink) 4%, transparent) 75%),
    linear-gradient(-45deg, transparent 75%, color-mix(in oklab, var(--ink) 4%, transparent) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 0 12px, 12px -12px, -12px 0;
}
.print-target { display: block; max-width: 420px; width: 100%; }
.print-target svg {
  max-width: 100%; height: auto; border-radius: 3px;
  box-shadow: 0 24px 60px rgba(31,21,18,.25), 0 8px 24px rgba(31,21,18,.14);
}
.notes {
  padding: 15px 17px; background: color-mix(in oklab, var(--accent) 6%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent);
  border-radius: 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
}
.notes strong { color: var(--accent); font-family: var(--font-display); font-weight: 700; }

@media print {
  html, body { background: #fff !important; }
  .chrome, .export-head, .export-side, .stage, .toast { display: none !important; }
  .export-body { display: block !important; padding: 0 !important; max-width: none !important; }
  .export-page { padding: 0 !important; }
  .print-target { max-width: none !important; }
  .print-target svg {
    box-shadow: none !important; max-width: 100% !important;
    max-height: 96vh !important; display: block; margin: 0 auto;
  }
  @page { margin: 10mm; }
}

/* ======================= SHOP IDENTITY MODAL ======================= */
.modal-bd {
  position: fixed; inset: 0; z-index: 500; padding: 20px;
  background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeUp .2s ease;
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 24px; width: min(460px, 100%); box-shadow: var(--shadow-md);
  max-height: 90vh; overflow: auto;
}
.modal h3 { font-family: var(--font-display); margin: 0 0 4px; font-size: 23px; }
.modal .msub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.logo-drop { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.logo-prev {
  width: 66px; height: 66px; border-radius: 12px; flex-shrink: 0;
  border: 1px solid var(--line-2); background: var(--surface-2);
  display: grid; place-items: center; overflow: hidden;
  color: var(--muted); font-family: var(--font-display); font-size: 26px;
}
.logo-prev img { width: 100%; height: 100%; object-fit: contain; }
.acc-sws { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.acc-sw {
  width: 30px; height: 30px; border-radius: 50%; position: relative;
  border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}
.acc-sw.on { border-color: var(--ink); }
.acc-sw.auto { background: var(--surface-2); color: var(--muted);
  display: grid; place-items: center; font-size: 9px; font-family: var(--font-eyebrow); }
.modal-acts { display: flex; gap: 9px; margin-top: 22px; }

/* ======================= A4 BATCH SHEET ======================= */
.sheet-page { min-height: 100vh; background: var(--bg); padding-bottom: 44px; }
.sheet-tools {
  position: sticky; top: 0; z-index: 5; padding: 12px 22px; flex-wrap: wrap;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px;

      animId:    ai === 255 ? null : (ANIMATIONS[ai] || {}).id || null,
      fontId:    fi === 255 ? null : (FONTS[fi] || {}).id || null,
      soundId:   sid,
      styleId:   tid,

      openAt:    oa,

  const legacyJson = card => ({ o: card.occasionId, t: card.to, m: card.message,
    f: card.from, s: card.shop, p: card.paletteId, a: card.animId, ft: card.fontId,

  // apps and messengers cut a URL at '#' or drop what follows it, which opened
  // the site with no card. A query parameter survives every one of them.
  async function encodeCard(card) {

    openMode: j.om || 0, openAt: j.oa || 0 });

  // Reads whichever form the link arrived in: the query parameters used now,
  // and the '#d/' and '#c/' fragments used by cards already printed.
  async function readCard(search, hash) {
    try {
      const q = new URLSearchParams(search || '');
      if (q.get('c')) return unpack(await inflate(fromB64(q.get('c'))));
      if (q.get('l')) return fromLegacyJson(JSON.parse(dec.decode(fromB64(q.get('l')))));
      if (hash.startsWith('#d/')) return unpack(await inflate(fromB64(hash.slice(3))));
      if (hash.startsWith('#c/')) return fromLegacyJson(JSON.parse(dec.decode(fromB64(hash.slice(3)))));

// Pull an 11-char video id (and optional start time) out of any YouTube link
// form, or a bare id. Returns { id, start } or null.
function parseYtTime(t) {
  if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  let s = 0, m;
  if ((m = t.match(/(\d+)h/))) s += +m[1] * 3600;
  if ((m = t.match(/(\d+)m/))) s += +m[1] * 60;
  if ((m = t.match(/(\d+)s/))) s += +m[1];
  if (!s && t.includes(':')) s = t.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
  return s || 0;
}
function parseYouTube(input) {
  if (!input) return null;
  input = input.trim();
  let id = null, start = 0;
  try {
    const u = new URL(input);
    if (/youtu\.be$/.test(u.hostname)) id = u.pathname.slice(1, 12);
    else if (u.searchParams.get('v')) id = u.searchParams.get('v');
    else { const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if (m) id = m[2]; }
    start = parseYtTime(u.searchParams.get('t') || u.searchParams.get('start') || '');
  } catch (e) {}
  if (!id && /^[\w-]{11}$/.test(input)) id = input;
  if (id) id = id.slice(0, 11);
  return (id && /^[\w-]{11}$/.test(id)) ? { id, start } : null;
}

// Play one short synthesised phrase. Called on the envelope's open gesture, so
// the browser's autoplay gate is satisfied. All voices decay on their own; the
// context closes itself a few seconds later. `id` of 'off'/null plays nothing.
function playCardSound(id) {
  if (!id || id === 'off') return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const conf = SOUNDS.find(s => s.id === id) || SOUNDS[0];
  let ctx;
  try { ctx = new AC(); } catch (e) { return; }
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  const now = ctx.currentTime;

  const master = ctx.createGain();
  master.gain.value = 0.0001;
  master.connect(ctx.destination);
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.55, now + 0.03);

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 5200;
  lp.connect(master);

  // a soft echo for sparkle
  const delay = ctx.createDelay(1.0); delay.delayTime.value = 0.22;
  const fb = ctx.createGain(); fb.gain.value = 0.24;
  const wet = ctx.createGain(); wet.gain.value = 0.3;
  lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);

  const ping = (freq, start, dur, gain) => {
    const t = now + start;
    const o = ctx.createOscillator(); o.type = conf.type; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  };
  for (const [f, s, d, g] of conf.seq) ping(f, s, d, g);

  const total = Math.max(...conf.seq.map(n => n[1] + n[2])) + 0.5;
  master.gain.setValueAtTime(0.55, now + total - 0.4);
  master.gain.exponentialRampToValueAtTime(0.0001, now + total);
  setTimeout(() => { try { ctx.close(); } catch (e) {} }, (total + 0.4) * 1000);
}

        <h3>ابدأ في ٣ خطوات</h3>
        <div class="intro-steps">
          <div class="intro-step"><span class="intro-num">١</span><div><b>اختر مناسبة وتصميم</b><span>أو ابدأ بتصميم جاهز</span></div></div>
          <div class="intro-step"><span class="intro-num">٢</span><div><b>اكتب رسالتك</b><span>وأضف صوتاً أو أغنية</span></div></div>
          <div class="intro-step"><span class="intro-num">٣</span><div><b>ولّد الباركود</b><span>اطبعه أو شاركه كصورة</span></div></div>
        </div>
      </div>` : ''}

      ${state.editId ? `<div class="edit-banner">
        <span><b>تعديل كرت محفوظ</b> — عدّل ما تريد ثم احفظ. سيصدر <b>باركود جديد</b> يحمل التعديل (الباركود القديم المطبوع يبقى يفتح النسخة السابقة).</span>
        <button id="cancelEdit">إلغاء · كرت جديد</button></div>` : ''}

      <section class="composer">
        <div>
          <div class="panel">
            <div class="panel-title">تصاميم جاهزة</div>
            <div class="presets" id="presetRow">
              ${PRESETS.map(p => { const pal = PALETTES.find(x => x.id === p.paletteId) || PALETTES[0];
                return `<button class="preset ${presetMatches(p, f) ? 'on' : ''}" data-preset="${p.id}" style="--pbg:${pal.bg};--pacc:${pal.accent}">
                  <span class="preset-swatch"><i></i></span>
                  <span class="preset-name">${p.name}</span>
                </button>`; }).join('')}
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">المناسبة</div>
            <div class="occasions" id="occGrid">
              ${OCCASIONS.map(o => `
                <button class="occ ${o.id === f.occasionId ? 'on' : ''}" data-occ="${o.id}">
                  <span class="l">${o.label}</span>
                </button>`).join('')}
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">الرسالة</div>
            <div class="grid2">
              <div class="field"><label class="lbl" for="fTo">إلى</label>
                <input id="fTo" type="text" placeholder="اسم المستلم" value="${esc(f.to)}"></div>
              <div class="field"><label class="lbl" for="fFrom">من</label>
                <input id="fFrom" type="text" placeholder="اسم المرسل" value="${esc(f.from)}"></div>
            </div>
            <div class="field"><label class="lbl" for="fMsg">الكلمة</label>
              <textarea id="fMsg" maxlength="400" placeholder="اكتب كلمة من القلب…">${esc(f.message)}</textarea>
              <div class="hint">
                <span id="densityHint">—</span>
                <span><b id="cCount">${f.message.length}</b> / 400</span>
              </div>
            </div>
            <div class="field"><label class="lbl" for="fShop">${state.customerMode ? 'التوقيع أسفل الكرت' : 'اسم المحل'}</label>
              <input id="fShop" type="text" placeholder="زهور المدينة" value="${esc(f.shop)}"></div>
          </div>

          <div class="panel">
            <div class="panel-title">التصميم</div>
            <label class="lbl">نمط الكرت</label>
            <div class="opt-row" id="styleRow">
              ${STYLES.map(s => `
                <button class="chip ${(f.styleId || 'classic') === s.id ? 'on' : ''}" data-style="${s.id}">${s.name}</button>`).join('')}
            </div>
            <div class="field"><label class="lbl">لون الكرت</label>
            <div class="opt-row" id="palRow">
              <button class="chip ${!f.paletteId ? 'on' : ''}" data-pal="">تلقائي</button>
              ${PALETTES.map(p => `
                <button class="chip ${f.paletteId === p.id ? 'on' : ''}" data-pal="${p.id}">
                  <span class="sw" style="background:${p.accent}"></span>${p.name}
                </button>`).join('')}
            </div></div>
            <div class="field"><label class="lbl">الحركة</label>
              <div class="opt-row" id="animRow">
                <button class="chip ${!f.animId ? 'on' : ''}" data-anim="">تلقائي</button>
                ${ANIMATIONS.map(a => `
                  <button class="chip ${f.animId === a.id ? 'on' : ''}" data-anim="${a.id}">${a.name}</button>`).join('')}
              </div>
            </div>
            <div class="field"><label class="lbl">خط الرسالة</label>
              <div class="opt-row" id="fontRow">
                ${FONTS.map(ft => `
                  <button class="chip ${f.fontId === ft.id ? 'on' : ''}" data-font="${ft.id}"
                    style="font-family:${ft.css}">${ft.name}</button>`).join('')}
              </div>
            </div>
            <div class="field">
              <label class="lbl">الصوت <span style="color:var(--muted)">· يبدأ عند فتح الكرت</span></label>
              <div class="opt-row" id="soundRow">
                <button class="chip ${!f.soundId ? 'on' : ''}" data-sound="">تلقائي</button>
                <button class="chip ${f.soundId === 'off' ? 'on' : ''}" data-sound="off">بدون</button>
                ${SOUNDS.map(s => `
                  <button class="chip ${f.soundId === s.id ? 'on' : ''}" data-sound="${s.id}">${s.name}</button>`).join('')}
                <button class="chip" id="soundTest" type="button" title="استمع">استمع ▶</button>
              </div>
            </div>
            <div class="field">
              <label class="lbl" for="fYt">أغنية من يوتيوب <span style="color:var(--muted)">· تعزف عند فتح الكرت</span></label>
              <input id="fYt" type="text" dir="ltr" placeholder="ألصق رابط يوتيوب هنا"
                value="${f.ytId ? ('https://youtu.be/' + f.ytId) : ''}">
              <div id="ytStatus" class="opt-note"></div>
            </div>
            <div class="opt-note">«تلقائي» يتبع المناسبة المختارة. أي خيار تحدده يتجاوزها. إن أضفت أغنية يوتيوب فهي تحلّ محل الصوت المصمّم.</div>
          </div>

          <div class="panel">
            <div class="panel-title">طريقة الفتح والتوقيت</div>
            <label class="lbl">أسلوب الفتح</label>
            <div class="opt-row" id="openModeRow">
              <button class="chip ${f.openMode !== 1 ? 'on' : ''}" data-open="0">ظرف مغلق</button>
              <button class="chip ${f.openMode === 1 ? 'on' : ''}" data-open="1">كشط الكرت</button>
            </div>
            <div class="field"><label class="lbl">موعد الفتح</label>
              <div class="opt-row" id="schedRow">
                <button class="chip ${!f.openAt ? 'on' : ''}" data-sched="now">الآن</button>
                <button class="chip ${f.openAt ? 'on' : ''}" data-sched="at">في وقت محدد</button>
              </div>
              <div id="schedWrap" style="margin-top:10px;${f.openAt ? '' : 'display:none'}">
                <input id="fSchedAt" type="datetime-local" value="${f.openAt ? toLocalInput(f.openAt) : ''}">
                <div class="opt-note">قبل الموعد يظهر عدّاد تنازلي، وفي الوقت ينفتح الكرت. يعتمد على ساعة جهاز المستلم.</div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div class="sticky">
            <div class="panel">
              <div class="panel-title">معاينة · شاشة العميل</div>
              <div class="phone"><iframe id="pvFrame" title="معاينة الكرت"></iframe></div>
              <div class="row" style="margin-top:13px">
                <button class="btn btn-secondary" id="btnReplay">إعادة الحركة</button>
                <button class="btn btn-primary" id="btnMake">${state.editId ? 'حفظ التعديلات' : 'توليد الباركود'}</button>
              </div>
              ${!state.customerMode ? `<button class="btn btn-secondary" id="btnBulk" style="width:100%;margin-top:9px">إنشاء بالجملة · قائمة أسماء</button>` : ''}
            </div>
          </div>
        </div>
      </section>

      <section class="result" id="result"></section>

      ${state.customerMode ? '' : `
      <section class="gallery" id="gallery">
        <div class="gallery-head"><h2>الكروت المحفوظة</h2>
          <span>${cards.length} كرت${cards.length ? ` · <button id="printAll" style="color:var(--accent);font-family:var(--font-eyebrow);letter-spacing:.06em">طباعة الكل ↗</button>` : ''}</span></div>
        <div class="gcards" id="gcards">
          ${cards.length === 0
            ? `<div class="empty" style="grid-column:1/-1">لم تنشئ أي كرت بعد. ابدأ من الأعلى ✦</div>`
            : cards.map(c => {
                const o = occOf(c.occasionId);
                return `<div class="gcard">
                  <div class="gcard-tag">${o.label}</div>
                  <div class="gcard-to">${esc(c.to || '—')}</div>
                  <div class="gcard-msg">${esc(c.message)}</div>
                  <div class="gcard-meta">
                    <span>${new Date(c.createdAt).toLocaleDateString('ar', {day:'numeric', month:'short'})}</span>
                    <span>
                      <button data-edit="${c.id}">تعديل</button>
                      <button data-open="${c.id}">الباركود</button>
                      <button data-del="${c.id}">حذف</button>
                    </span>
                  </div></div>`;
              }).join('')}
        </div>
      </section>`}
    </main>`;

  document.getElementById('themeBtn').onclick = toggleTheme;
  const saved = document.getElementById('tabSaved');
  if (saved) saved.onclick = () => document.getElementById('gallery').scrollIntoView({behavior:'smooth'});
  const brandBtn = document.getElementById('brandBtn');
  if (brandBtn) brandBtn.onclick = openShopModal;
  const presetRow = document.getElementById('presetRow');
  if (presetRow) presetRow.onclick = e => { const b = e.target.closest('[data-preset]'); if (b) applyPreset(b.dataset.preset); };
  const introClose = document.getElementById('introClose');
  if (introClose) introClose.onclick = () => { markIntro(); const el = document.getElementById('intro'); if (el) el.remove(); };
  const btnBulk = document.getElementById('btnBulk');
  if (btnBulk) btnBulk.onclick = openBulkModal;

  document.getElementById('occGrid').onclick = e => {
    const b = e.target.closest('[data-occ]'); if (!b) return;
    f.occasionId = b.dataset.occ;
    document.querySelectorAll('.occ').forEach(el => el.classList.toggle('on', el.dataset.occ === f.occasionId));
    refreshPreview();
  };
  const pick = (rowId, attr, key) => {
    const row = document.getElementById(rowId); if (!row) return;
    row.onclick = e => {
      const b = e.target.closest('[' + attr + ']'); if (!b) return;
      f[key] = b.getAttribute(attr) || null;
      row.querySelectorAll('.chip').forEach(el =>
        el.classList.toggle('on', (el.getAttribute(attr) || null) === f[key]));
      refreshPreview();
    };
  };
  pick('palRow', 'data-pal', 'paletteId');
  pick('animRow', 'data-anim', 'animId');
  pick('fontRow', 'data-font', 'fontId');
  pick('soundRow', 'data-sound', 'soundId');
  // The style row always has one selection (classic by default), so it toggles
  // on the resolved value rather than the raw (possibly null) form field.
  const styleRow = document.getElementById('styleRow');
  if (styleRow) styleRow.onclick = e => {
    const b = e.target.closest('[data-style]'); if (!b) return;
    f.styleId = b.dataset.style;
    styleRow.querySelectorAll('.chip').forEach(el => el.classList.toggle('on', el.dataset.style === f.styleId));
    refreshPreview();
  };
  const soundTest = document.getElementById('soundTest');
  if (soundTest) soundTest.onclick = e => { e.stopPropagation(); playCardSound(soundOf(state.form)); };

  const el = id => document.getElementById(id);
  const onInput = () => {
    f.to = el('fTo').value.trim(); f.from = el('fFrom').value.trim();
    f.shop = el('fShop').value.trim(); f.message = el('fMsg').value;
    el('cCount').textContent = f.message.length;
    updateDensityHint();
    clearTimeout(renderComposer._t);
    renderComposer._t = setTimeout(refreshPreview, 220);
  };
  ['fTo','fFrom','fShop','fMsg'].forEach(id => el(id).addEventListener('input', onInput));

  const fYt = el('fYt');
  if (fYt) fYt.addEventListener('input', () => {
    const p = parseYouTube(fYt.value);
    f.ytId = p ? p.id : null;
    f.ytStart = p ? p.start : 0;
    renderYtStatus();
    updateDensityHint();
  });
  renderYtStatus();

  const openRow = el('openModeRow');
  if (openRow) openRow.onclick = e => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    f.openMode = +b.dataset.open;
    openRow.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', +x.dataset.open === f.openMode));
    refreshPreview();
  };
  const schedRow = el('schedRow'), schedWrap = el('schedWrap'), fSchedAt = el('fSchedAt');
  const syncSched = () => { if (schedRow) schedRow.querySelectorAll('.chip').forEach(x =>
    x.classList.toggle('on', (x.dataset.sched === 'at') === (f.openAt > 0))); };
  if (schedRow) schedRow.onclick = e => {
    const b = e.target.closest('[data-sched]'); if (!b) return;
    if (b.dataset.sched === 'now') { f.openAt = 0; schedWrap.style.display = 'none'; }
    else { schedWrap.style.display = 'block'; if (fSchedAt && fSchedAt.value) f.openAt = Math.floor(new Date(fSchedAt.value).getTime() / 1000); }
    syncSched(); updateDensityHint();
  };
  if (fSchedAt) fSchedAt.addEventListener('input', () => {
    f.openAt = fSchedAt.value ? Math.floor(new Date(fSchedAt.value).getTime() / 1000) : 0;
    syncSched(); updateDensityHint();
  });

  el('btnMake').onclick = makeCard;
  el('btnReplay').onclick = () => refreshPreview();

  const cancel = document.getElementById('cancelEdit');
  if (cancel) cancel.onclick = () => { state.editId = null; state.form = freshForm(); renderComposer(); };

  const gc = el('gcards');
  if (gc) gc.onclick = async e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { editCard(ed.dataset.edit); return; }
    const d = e.target.closest('[data-del]');
    if (d) {
      const wasEditing = state.editId === d.dataset.del;
      saveCards(loadCards().filter(c => c.id !== d.dataset.del));
      if (wasEditing) { state.editId = null; state.form = freshForm(); }
      renderComposer(); toast('حُذف الكرت'); return;
    }
    const o = e.target.closest('[data-open]');
    if (o) { const c = loadCards().find(x => x.id === o.dataset.open); if (c) await showResult(c); }
  };
  const printAll = document.getElementById('printAll');
  if (printAll) printAll.onclick = () => {
    const all = loadCards();
    if (!all.length) return;
    SHEET_BASE = all; SHEET_COPIES = 1; SHEET_COLS = 2; location.hash = 'sheet';
  };

  updateDensityHint();
  refreshPreview();
}

// A longer message makes a denser symbol, and density is what makes a printed
// code fail to scan. Tell the shop where they stand while they are still typing.
function readability(modules) {
  if (modules <= 61) return { cls:'', word:'يقرأ بسهولة' };
  if (modules <= 81) return { cls:'', word:'جيد' };
  return { cls:'mid', word:'كثيف — اختصر الرسالة أو اطبعه أكبر' };
}
// Shows whether the pasted link resolved to a playable song, with a small
// click-to-play preview so the shop can confirm the right track before printing.
function renderYtStatus() {
  const el = document.getElementById('ytStatus');
  if (!el) return;
  const id = state.form.ytId;
  if (!id) { el.textContent = 'اختياري — يعمل عند وجود إنترنت وقت المسح.'; el.style.color = ''; return; }
  el.style.color = '';
  el.innerHTML = `<span style="color:var(--ok);font-weight:500">الأغنية جاهزة</span> · تعزف عند فتح الكرت وتحتاج إنترنت
    <button id="ytClear" style="color:var(--accent);margin-inline-start:8px">إزالة</button>
    <div class="yt-prev"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="معاينة الأغنية"
      allow="encrypted-media" allowfullscreen loading="lazy"></iframe></div>`;
  el.querySelector('#ytClear').onclick = () => {
    state.form.ytId = null; state.form.ytStart = 0;
    const f = document.getElementById('fYt'); if (f) f.value = '';
    renderYtStatus(); updateDensityHint();
  };
}

async function updateDensityHint() {
  const h = document.getElementById('densityHint');
  if (!h) return;
  const url = await CODEC.encodeCard({ ...state.form });
  const modules = QR.encode(url, 'M').size;
  const r = readability(modules);
  h.innerHTML = `<span class="density ${r.cls}"><span class="dot"></span>`
    + `${r.word} · ${modules}×${modules} · أقل طباعة ${printMm(modules)} مم</span>`;
}

function refreshPreview() {
  const iframe = document.getElementById('pvFrame');
  if (!iframe) return;
  const f = state.form;
  iframe.srcdoc = recipientDoc({
    occasionId: f.occasionId,
    to: f.to || 'صديقي العزيز',
    from: f.from || '',
    shop: f.shop || 'باقة',
    message: f.message || 'كل عام وأنت بخير، وكل لحظة حلوة تكون من نصيبك.',
    paletteId: f.paletteId, animId: f.animId, fontId: f.fontId, soundId: f.soundId, styleId: f.styleId,
    openMode: f.openMode,   // preview shows scratch vs envelope; schedule is ignored in preview
  }, true);
}

// Load a saved card back into the composer for editing. Regenerating then
// updates that same record in place (keeps its id and original date).
function editCard(id) {
  const c = loadCards().find(x => x.id === id);
  if (!c) return;
  state.editId = id;
  state.form = {
    occasionId: c.occasionId, to: c.to || '', from: c.from || '', shop: c.shop || '',
    message: c.message || '', paletteId: c.paletteId || null, animId: c.animId || null,
    fontId: c.fontId || 'naskh', soundId: c.soundId || null, styleId: c.styleId || null,
    ytId: c.ytId || null, ytStart: c.ytStart || 0,
  };
  renderComposer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('حمّلنا الكرت للتعديل');
}

async function makeCard() {
  const f = state.form;
  if (!f.message.trim()) { toast('اكتب رسالتك أولًا'); return; }
  const btn = document.getElementById('btnMake');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جاري التوليد…'; }
  const editing = state.editId ? loadCards().find(c => c.id === state.editId) : null;
  const card = {
    id: editing ? editing.id : 'c_' + Math.random().toString(36).slice(2, 10),
    createdAt: editing ? editing.createdAt : Date.now(),
    occasionId: f.occasionId,
    to: f.to.trim(), from: f.from.trim(),
    shop: f.shop.trim() || 'باقة',
    message: f.message.trim(),
    paletteId: f.paletteId, animId: f.animId, fontId: f.fontId, soundId: f.soundId, styleId: f.styleId,
    ytId: f.ytId, ytStart: f.ytStart, openMode: f.openMode, openAt: f.openAt,
  };
  if (editing) card.updatedAt = Date.now();
  card.url = await CODEC.encodeCard(card);
  if (!state.customerMode) {
    let list = loadCards();
    list = editing ? list.map(c => c.id === card.id ? card : c) : (list.unshift(card), list);
    saveCards(list);
    state.editId = null;
    renderComposer();
    toast(editing ? 'حُفظت التعديلات' : 'أُنشئ الكرت');
  }
  await showResult(card);
  const b2 = document.getElementById('btnMake');
  if (b2) { b2.disabled = false; b2.textContent = state.editId ? 'حفظ التعديلات' : 'توليد الباركود'; }
  document.getElementById('result').scrollIntoView({ behavior:'smooth', block:'start' });
}

async function showResult(card) {
  const box = document.getElementById('result');
  if (!box) return;
  const url = card.url || await CODEC.encodeCard(card);
  const { size } = QR.toPath(url, 'M');
  const mm = printMm(size);
  const r = readability(size);
  box.classList.add('on');
  box.innerHTML = `
    <div class="qr-wrap">${QR.toSVG(url, { ecl:'M', scale:8, margin:4 })}</div>
    <div>
      <h3>الباركود جاهز</h3>
      <p>رمز خاص بهذا الكرت وحده. اطبعه على البطاقة أو الشريط، وحين يمسحه المستلم تنفتح صفحته كاملة.</p>
      <div class="linkbox">
        <input id="shareUrl" type="text" readonly value="${esc(url)}" onclick="this.select()">
        <button id="copyBtn">نسخ</button>
      </div>
      <div class="density ${r.cls}"><span class="dot"></span>
        ${r.word} · ${size}×${size} · لا تطبعه بعرض أقل من ${mm} مم</div>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-secondary" id="waBtn">واتساب</button>
        <button class="btn btn-secondary" id="imgBtn">صورة</button>
        <button class="btn btn-secondary" id="shareBtn">مشاركة</button>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="btn btn-secondary" id="openBtn">افتح الكرت</button>
        <button class="btn btn-secondary" id="scanBtn">تكبير للمسح</button>
        <button class="btn btn-primary" id="expBtn">صفحة الطباعة ↗</button>
      </div>
    </div>`;
  const shareText = 'كرت باقة خاص لك، افتحه من هنا:\n' + url;
  document.getElementById('waBtn').onclick = () =>
    window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
  document.getElementById('imgBtn').onclick = () => shareCardImage(card, url);
  document.getElementById('shareBtn').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title: 'كرت باقة', text: 'كرت خاص لك', url }); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(url); toast('نُسخ الرابط'); } catch { toast('انسخ الرابط من الحقل'); } }
  };
  document.getElementById('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast('نُسخ الرابط'); }
    catch { toast('انسخ الرابط من الحقل'); }
  };
  document.getElementById('openBtn').onclick = () => { location.href = url; };
  document.getElementById('scanBtn').onclick = () => showScanView(url, size);
  document.getElementById('expBtn').onclick = () => {
    if (!card.id || state.customerMode) { EXPORT_CARD = card; location.hash = 'x'; }
    else location.hash = 'e/' + card.id;
  };
}

// Scanning a screen is much harder for a camera than scanning paper: the code
// is small, the backlight flickers, and glare washes out the contrast. This
// fills the display with the symbol on pure white and nothing else.
function showScanView(url, modules) {
  document.querySelectorAll('.scanview').forEach(n => n.remove());
  const v = document.createElement('div');
  v.className = 'scanview';
  v.innerHTML = `
    <div class="scanview-inner">

      <div class="scanview-note">

      </div>
    </div>
    <button class="scanview-close" aria-label="إغلاق">إغلاق ✕</button>`;
  document.body.appendChild(v);
  const close = () => { v.remove(); document.removeEventListener('keydown', onKey); };

}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light'
    : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('baaqa.theme', next); } catch {}
  refreshPreview();
}

// Read an uploaded logo and shrink it so it stays tiny in localStorage.
function downscaleImage(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/png'));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* =====================================================================
   Print templates.
   Rules that keep them scannable: nothing is ever drawn over the symbol,
   the quiet zone is at least 6 modules, and shape-rendering is crispEdges
   so modules do not antialias into grey when rasterised to PNG.
   ===================================================================== */
function svgOpen(w, h) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" `
    + `font-family="Amiri, 'Times New Roman', serif" shape-rendering="crispEdges">`;
}
function symbol(url, x, y, px) {
  const qr = QR.toPath(url, 'M');
  return { size: qr.size,
    svg: `<g transform="translate(${x}, ${y}) scale(${px / qr.size})"><path d="${qr.path}" fill="#1F1512"/></g>` };
}

// Greedy word-wrap for SVG text (no auto-wrap in SVG).
function wrapText(str, max) {
  const words = String(str || '').split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
    else cur = (cur ? cur + ' ' : '') + w;
  }
  if (cur) lines.push(cur);
  return lines;
}

// A portrait share image (4:5) in the card's own palette — for WhatsApp /

function tplPoster(card, url, brand) {
  const W = 1080, H = 1350, o = occOf(card.occasionId);
  const pal = paletteOf(card), b = brand || brandOf(card);
  const acc = pal.accent, ink = pal.ink, bg = pal.bg;

  const qp = 240, qx = W - 290, qy = H - 300, s = symbol(url, qx, qy, qp);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Amiri, 'Times New Roman', serif" shape-rendering="geometricPrecision">
    <defs><radialGradient id="pg" cx="50%" cy="22%" r="75%">
      <stop offset="0%" stop-color="${acc}" stop-opacity="0.34"/>
      <stop offset="72%" stop-color="${bg}" stop-opacity="0"/>

    <rect width="${W}" height="${H}" fill="${bg}"/>
    <rect width="${W}" height="${H}" fill="url(#pg)"/>

    <rect x="${qx-16}" y="${qy-16}" width="${qp+32}" height="${qp+32}" rx="14" fill="#ffffff"/>
    ${s.svg}

    <text x="370" y="${H-108}" text-anchor="end" font-family="Reem Kufi, sans-serif" font-size="30" fill="${ink}" fill-opacity="0.72" direction="rtl">لفتح الكرت</text>
  </svg>`;
}

// Build the poster as a PNG and hand it to the OS share sheet (with the link),
// falling back to a download where file-sharing is unsupported.
async function shareCardImage(card, url) {
  toast('نجهّز الصورة…');
  try {
    const blob = await svgToPng(tplPoster(card, url), 1080);
    const file = new File([blob], 'baaqa-card.png', { type: 'image/png' });
    const text = 'كرت باقة خاص لك: ' + url;
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    await download('baaqa-card.png', blob);
  } catch (e) { toast('تعذّر توليد الصورة'); }
}

async function svgToPng(svg, targetW) {
  const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas');
  cv.width = targetW;
  cv.height = Math.round(targetW * img.height / img.width);
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

async function download(filename, data) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { await dl.save({ filename, data }); toast('تم التحميل'); return; }
  } catch (e) {}
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type:'image/svg+xml' });
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    toast('تم التحميل');
  } catch (e) { toast('التحميل غير متاح — استخدم الطباعة'); }
}

// The "locked until a moment" screen — a live countdown over the card's motion.
function countdownBody(card) {
  const o = occOf(card.occasionId), mono = initialOf(card);
  return `
    <canvas class="rec-canvas" id="cv"></canvas>
    <div class="rec-vignette"></div>
    <div class="rec-stage"><div class="countdown">
      <div class="cd-mono"><span>${mono}</span></div>
      <div class="cd-eyebrow">${esc(o.eyebrow)}</div>
      ${card.to ? `<div class="cd-to">${esc(card.to)}</div>` : ''}
      <div class="cd-label">يُفتح بعد</div>
      <div class="cd-timer" id="cdTimer"></div>
      <div class="cd-date" id="cdDate"></div>
    </div></div>
    <div class="rec-brand">من <strong>${esc(card.shop || 'باقة')}</strong></div>`;
}
function startCountdown(root, targetMs, onDone) {
  const timer = root.querySelector('#cdTimer'), dateEl = root.querySelector('#cdDate');
  if (dateEl) { try { dateEl.textContent = new Date(targetMs).toLocaleString('ar', { dateStyle: 'full', timeStyle: 'short' }); } catch (e) {} }
  const pad = n => String(n).padStart(2, '0');
  const unit = (v, l) => `<span class="cd-u"><b>${pad(v)}</b><i>${l}</i></span>`;
  const tick = () => {
    const d = targetMs - Date.now();
    if (d <= 0) { clearInterval(id); onDone(); return; }
    const s = Math.floor(d / 1000), dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600),
      mm = Math.floor(s % 3600 / 60), ss = s % 60;
    timer.innerHTML = unit(dd, 'يوم') + unit(hh, 'ساعة') + unit(mm, 'دقيقة') + unit(ss, 'ثانية');
  };
  tick();
  const id = setInterval(tick, 1000);
}
