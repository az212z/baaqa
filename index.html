<style>
:root {
  --bg: #F6EFE7;
  --surface: #FFFFFF;
  --surface-2: #FBF6EF;
  --ink: #1F1512;
  --ink-2: #4A362E;
  --muted: #8B7168;
  --line: rgba(31,21,18,0.10);
  --line-2: rgba(31,21,18,0.18);
  --accent: #742036;
  --blush: #E8B4A7;
  --gold: #B08549;
  --ok: #2F6B4A;
  --warn: #9A6218;
  --shadow-sm: 0 1px 2px rgba(31,21,18,0.06), 0 4px 12px rgba(31,21,18,0.04);
  --shadow-md: 0 4px 12px rgba(31,21,18,0.08), 0 20px 40px rgba(31,21,18,0.08);
  --radius: 14px;
  --font-display: "Amiri", "Times New Roman", serif;
  --font-ui: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-eyebrow: "Reem Kufi", "Tajawal", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160B0E; --surface: #22141A; --surface-2: #2A1A20;
    --ink: #F0E6DD; --ink-2: #D6C7BB; --muted: #96827A;
    --line: rgba(240,230,221,0.10); --line-2: rgba(240,230,221,0.18);
    --accent: #C94664; --blush: #E8B4A7; --gold: #D4A76A;
    --ok: #5FB58A; --warn: #E0A94A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #160B0E; --surface: #22141A; --surface-2: #2A1A20;
  --ink: #F0E6DD; --ink-2: #D6C7BB; --muted: #96827A;
  --line: rgba(240,230,221,0.10); --line-2: rgba(240,230,221,0.18);
  --accent: #C94664; --blush: #E8B4A7; --gold: #D4A76A;
  --ok: #5FB58A; --warn: #E0A94A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { direction: rtl; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- top bar ---------- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
}
.chrome-inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
}
.logo-mark {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--blush), var(--accent) 70%);
  position: relative; flex-shrink: 0;
}
.logo-mark::after {
  content: ""; position: absolute; inset: 6px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
}
.logo small {
  font-family: var(--font-eyebrow); font-size: 9px; font-weight: 500;
  letter-spacing: .16em; color: var(--muted); text-transform: uppercase;
  display: block; margin-top: -3px;
}
.chrome-spacer { flex: 1; }
.chrome-act { display: flex; gap: 6px; align-items: center; }
.tab {
  padding: 7px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  transition: color .15s, background .15s;
}
.tab:hover { color: var(--ink); }
.tab.active { background: var(--ink); color: var(--bg); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted);
  border: 1px solid var(--line-2);
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- layout ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 26px 22px 80px; }
.eyebrow {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .22em;
  color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
}
h1.title {
  font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px);
  line-height: 1.15; margin: 0 0 8px; font-weight: 700; text-wrap: balance;
}
h1.title em { color: var(--accent); font-style: italic; font-weight: 400; }
.sub { color: var(--muted); max-width: 62ch; margin: 0; }

.composer {
  display: grid; grid-template-columns: 1.08fr 0.92fr;
  gap: 24px; margin-top: 26px; align-items: start;
}
@media (max-width: 940px) { .composer { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
}
.panel + .panel { margin-top: 16px; }
.panel-title {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .18em;
  color: var(--muted); text-transform: uppercase; margin: 0 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.panel-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* occasion grid */
.occasions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
@media (max-width: 560px) { .occasions { grid-template-columns: repeat(3, 1fr); } }
.occ {
  padding: 12px 6px 10px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface-2); text-align: center;
  transition: transform .15s, border-color .15s, background .15s;
}
.occ:hover { transform: translateY(-2px); border-color: var(--line-2); }
.occ.on {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent);
}
.occ .g { font-family: var(--font-display); font-size: 22px; line-height: 1;
  display: block; height: 26px; margin-bottom: 5px; color: var(--accent); }
.occ .l { font-size: 11.5px; font-weight: 500; display: block; }

/* fields */
.field { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
label.lbl {
  display: block; font-size: 10px; font-weight: 500; color: var(--muted);
  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px;
  font-family: var(--font-eyebrow);
}
.field input, .field textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 13px; color: var(--ink);
  transition: border-color .15s, background .15s;
}
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); background: var(--surface);
}
.field textarea {
  min-height: 110px; resize: vertical;
  font-family: var(--font-display); font-size: 17px; line-height: 1.7;
}
.hint {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 6px; font-size: 11px; color: var(--muted);
  font-family: var(--font-eyebrow); letter-spacing: .05em;
}
.hint b { color: var(--ink-2); font-weight: 500; }

/* option chips */
.opt-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 12.5px; color: var(--ink-2);
  transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
}
.chip:hover { border-color: var(--line-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw {
  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
}
.opt-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* preview */
.sticky { position: sticky; top: 88px; }
.phone {
  aspect-ratio: 9 / 16; max-height: 600px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; overflow: hidden; position: relative;
  box-shadow: var(--shadow-md);
}
.phone::before {
  content: ""; position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%); width: 40px; height: 4px; border-radius: 2px;
  background: color-mix(in oklab, var(--ink) 15%, transparent); z-index: 10;
}
.phone iframe { width: 100%; height: 100%; border: 0; background: var(--surface); }

.btn {
  padding: 11px 17px; border-radius: 10px; font-size: 14px; font-weight: 500;
  transition: transform .1s, background .15s; display: inline-flex;
  align-items: center; gap: 8px; justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--bg); flex: 1; }
.btn-primary:hover { background: var(--accent); }
.btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-2); }
.btn-secondary:hover { border-color: var(--ink); }
.row { display: flex; gap: 9px; flex-wrap: wrap; }
.row .btn { flex: 1 1 auto; }

/* result */
.result {
  display: none; margin-top: 28px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 20px; padding: 26px;
  box-shadow: var(--shadow-md); animation: fadeUp .45s ease;
}
.result.on { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
@media (max-width: 660px) { .result.on { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.qr-wrap {
  background: #fff; padding: 16px; border-radius: 14px;
  border: 1px solid var(--line); display: inline-block;
}
.qr-wrap svg { display: block; width: 210px; height: 210px; }
.result h3 { font-family: var(--font-display); font-size: 25px; margin: 0 0 6px; }
.result p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.linkbox {
  display: flex; align-items: center; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 4px 4px 4px 12px; overflow: hidden; width: 100%;
}
.linkbox input {
  flex: 1; background: transparent; border: 0; padding: 8px 4px;
  color: var(--ink-2); font-size: 12px; min-width: 0;
  direction: ltr; text-align: left;
}
.linkbox button {
  padding: 8px 14px; border-radius: 8px; background: var(--ink);
  color: var(--bg); font-size: 12px; font-weight: 500; flex-shrink: 0;
}
.density {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .08em;
  color: var(--muted);
}
.density .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.density.mid .dot { background: var(--warn); }

/* gallery */
.gallery { margin-top: 44px; }
.gallery-head {
  display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px;
}
.gallery-head h2 { font-family: var(--font-display); font-size: 23px; margin: 0; }
.gallery-head span { color: var(--muted); font-size: 13px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 13px; }
.gcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px; transition: transform .15s, border-color .15s; position: relative;
}
.gcard:hover { transform: translateY(-2px); border-color: var(--line-2); }
.gcard-tag {
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 5px;
}
.gcard-to { font-family: var(--font-display); font-size: 18px; margin: 0 0 3px; }
.gcard-msg {
  font-size: 12.5px; color: var(--muted); min-height: 34px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.gcard-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line);
  font-size: 11px; color: var(--muted);
  font-family: var(--font-eyebrow); letter-spacing: .08em;
}
.gcard-meta button { color: var(--muted); font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.gcard-meta button:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
.empty {
  padding: 38px 20px; text-align: center; color: var(--muted);
  background: var(--surface-2); border: 1px dashed var(--line-2);
  border-radius: 14px; font-family: var(--font-display); font-size: 16px;
}

/* ======================= RECIPIENT ======================= */
.recipient {
  position: fixed; inset: 0; background: var(--rec-bg, #1a0d10);
  color: var(--rec-ink, #f8ecd8); overflow: hidden; z-index: 100; display: none;
}
.recipient.on { display: block; }
.rec-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.rec-stage {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; perspective: 1400px; z-index: 2;
}
.envelope {
  width: min(86vw, 400px); aspect-ratio: 3 / 2; position: relative;
  transform-style: preserve-3d; cursor: pointer;
  transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .8s;
}
.env-body {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #f6e6c9, #e6cfa8); border-radius: 6px;
  box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.35),
              inset 0 0 0 1px rgba(255,255,255,.35);
}
.env-flap {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, #eed7ac, #d8ba82);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center; transform: rotateX(0deg);
  transition: transform 1s cubic-bezier(.6,.05,.3,1);
  box-shadow: inset 0 -6px 12px rgba(0,0,0,.12); z-index: 3;
}
.envelope.opening .env-flap { transform: rotateX(180deg); z-index: 1; }
.envelope.opening .env-inner { transform: translateY(-58%) scale(1); opacity: 1; }
.envelope.opening { transform: translateY(-30%) scale(1.05); }
.envelope.gone { opacity: 0; transform: translateY(-60%) scale(.9); pointer-events: none; }
.env-inner {
  position: absolute; left: 8%; right: 8%; top: 15%; bottom: 15%;
  background: linear-gradient(180deg, #fdfaf3, #f5ecd8); border-radius: 4px;
  z-index: 2; transform: translateY(0) scale(.98); opacity: .9;
  transition: transform 1.2s cubic-bezier(.2,.7,.2,1) .3s, opacity 1s .3s;
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.env-inner-mark { font-family: var(--font-display); font-size: 46px; color: var(--rec-accent); opacity: .55; }
.env-seal {
  position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  width: 72px; height: 72px; z-index: 4; transition: transform .5s, opacity .5s;
}
.envelope.opening .env-seal { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
.env-seal-circle {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #a83143, var(--rec-accent, #742036) 70%, #4b0f1f);
  box-shadow: inset -4px -6px 10px rgba(0,0,0,.5), inset 3px 4px 8px rgba(255,255,255,.15),
              0 4px 12px rgba(0,0,0,.4);
  display: grid; place-items: center; color: rgba(255,255,255,.85);
  font-family: var(--font-display); font-weight: 700; font-size: 25px; position: relative;
}
.env-seal-circle::before {
  content: ""; position: absolute; inset: 6px;
  border: 1px dashed rgba(255,255,255,.4); border-radius: 50%;
}
.env-hint {
  position: absolute; bottom: 7%; left: 0; right: 0; text-align: center;
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .28em;
  color: rgba(255,255,255,.55); text-transform: uppercase;
  animation: pulseUp 2.2s ease-in-out infinite; z-index: 5;
}
@keyframes pulseUp {
  0%,100% { transform: translateY(0); opacity: .5; }
  50% { transform: translateY(-6px); opacity: .95; }
}
.reveal {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 64px 24px 72px;
  opacity: 0; pointer-events: none; transition: opacity 1s ease .3s;
  z-index: 3; overflow-y: auto;
}
.reveal.on { opacity: 1; pointer-events: auto; }
.reveal-inner { max-width: 560px; width: 100%; text-align: center; }
.reveal-eyebrow {
  font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--rec-accent); margin-bottom: 8px;
  opacity: 0; animation: rise 1s ease .8s forwards;
}
.reveal-to {
  font-family: var(--rec-font, var(--font-display)); font-size: clamp(21px, 4.4vw, 31px);
  margin: 0 0 22px; opacity: 0; animation: rise 1s ease 1.1s forwards;
}
.reveal-to::before, .reveal-to::after {
  content: "❦"; margin: 0 12px; color: var(--rec-accent);
  font-size: .7em; vertical-align: middle; font-family: var(--font-display);
}
.reveal-msg {
  font-family: var(--rec-font, var(--font-display));
  font-size: clamp(20px, 3.4vw, 28px); line-height: 1.75;
  color: var(--rec-ink); margin: 0 0 28px; text-wrap: balance;
  white-space: pre-wrap; opacity: 0; animation: rise 1.4s ease 1.4s forwards;
}
.reveal-sig {
  display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
  opacity: 0; animation: rise 1s ease 2s forwards;
}
.reveal-sig-line { width: 50px; height: 1px; background: var(--rec-accent); opacity: .6; }
.reveal-sig-from {
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .26em;
  color: var(--rec-accent); text-transform: uppercase; margin: 3px 0 2px; opacity: .75;
}
.reveal-sig-name { font-family: var(--rec-font, var(--font-display)); font-size: 20px; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rec-brand {
  position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; z-index: 5;
  font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: .3em;
  text-transform: uppercase; color: rgba(255,255,255,.32); pointer-events: none;
}
.rec-brand strong {
  font-family: var(--font-display); font-weight: 700;
  color: rgba(255,255,255,.55); letter-spacing: .06em; font-size: 13px; margin-inline-start: 6px;
}
.rec-back {
  position: absolute; top: 16px; inset-inline-end: 16px; z-index: 6;
  padding: 7px 13px; border-radius: 999px; font-size: 12px;
  background: rgba(0,0,0,.35); color: rgba(255,255,255,.75);
  backdrop-filter: blur(8px);
}
.rec-back:hover { background: rgba(0,0,0,.55); color: #fff; }
.rec-vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,.34) 92%);
}

.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 20px;
  border-radius: 999px; font-size: 13px; z-index: 200; opacity: 0;
  transition: opacity .2s; box-shadow: var(--shadow-md); pointer-events: none;
}
.toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .env-hint { animation: none; }
}

/* ======================= EXPORT ======================= */
.export-page { min-height: 100vh; background: var(--bg); padding-bottom: 56px; }
.export-head {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line); padding: 12px 22px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.export-head h1 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; }
.export-head h1 small {

    out[o++] = 1;
    out[o++] = Math.max(0, OCCASIONS.findIndex(x => x.id === card.occasionId));
    out[o++] = card.paletteId ? Math.max(0, PALETTES.findIndex(x => x.id === card.paletteId)) : 255;
    out[o++] = card.animId    ? Math.max(0, ANIMATIONS.findIndex(x => x.id === card.animId))  : 255;
    out[o++] = card.fontId    ? Math.max(0, FONTS.findIndex(x => x.id === card.fontId))       : 255;
    for (const f of fields) { out[o++] = f.length >> 8; out[o++] = f.length & 255; out.set(f, o); o += f.length; }
    return out;
  }
  function unpack(bytes) {
    let o = 0;
    if (bytes[o++] !== 1) return null;
    const occ = OCCASIONS[bytes[o++]] || OCCASIONS[0];
    const pi = bytes[o++], ai = bytes[o++], fi = bytes[o++];
    const read = () => {
      const len = (bytes[o++] << 8) | bytes[o++];
      const s = dec.decode(bytes.subarray(o, o + len)); o += len; return s;
    };
    return {
      occasionId: occ.id,
      paletteId: pi === 255 ? null : (PALETTES[pi] || {}).id || null,
      animId:    ai === 255 ? null : (ANIMATIONS[ai] || {}).id || null,
      fontId:    fi === 255 ? null : (FONTS[fi] || {}).id || null,
      to: read(), from: read(), shop: read(), message: read(),
    };
  }

  async function encodeCard(card) {
    const base = location.origin + location.pathname;
    if (supported) {
      try { return base + '#d/' + toB64(await deflate(pack(card))); } catch (e) {}
    }
    // Fallback for browsers without CompressionStream: uncompressed JSON.
    const legacy = { o: card.occasionId, t: card.to, m: card.message, f: card.from, s: card.shop,
                     p: card.paletteId, a: card.animId, ft: card.fontId };
    return base + '#c/' + toB64(enc.encode(JSON.stringify(legacy)));
  }
  async function decodeHash(hash) {
    try {
      if (hash.startsWith('#d/')) return unpack(await inflate(fromB64(hash.slice(3))));
      if (hash.startsWith('#c/')) {
        const j = JSON.parse(dec.decode(fromB64(hash.slice(3))));
        return { occasionId: j.o, to: j.t, message: j.m, from: j.f, shop: j.s,
                 paletteId: j.p || null, animId: j.a || null, fontId: j.ft || null };
      }
    } catch (e) {}
    return null;
  }
  return { encodeCard, decodeHash, compressionSupported: supported };
})();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {

}

// A longer message makes a denser symbol, and density is what makes a printed
// code fail to scan. Tell the shop where they stand while they are still typing.
function readability(modules) {
  if (modules <= 61) return { cls:'', word:'يقرأ بسهولة' };
  if (modules <= 81) return { cls:'', word:'جيد' };
  return { cls:'mid', word:'كثيف — اختصر الرسالة أو اطبعه أكبر' };
}
async function updateDensityHint() {
  const h = document.getElementById('densityHint');
  if (!h) return;
  const url = await CODEC.encodeCard({ ...state.form });
  const modules = QR.encode(url, 'M').size;
  const r = readability(modules);
  h.innerHTML = `<span class="density ${r.cls}"><span class="dot"></span>`
    + `${r.word} · ${modules}×${modules} · أقل طباعة ${printMm(modules)} مم</span>`;
}

function refreshPreview() {
  const iframe = document.getElementById('pvFrame');
  if (!iframe) return;
  const f = state.form;
  iframe.srcdoc = recipientDoc({
    occasionId: f.occasionId,
    to: f.to || 'صديقي العزيز',
    from: f.from || '',
    shop: f.shop || 'باقة',
    message: f.message || 'كل عام وأنت بخير، وكل لحظة حلوة تكون من نصيبك.',
    paletteId: f.paletteId, animId: f.animId, fontId: f.fontId,
  }, true);
}

async function makeCard() {
  const f = state.form;
  if (!f.message.trim()) { toast('اكتب رسالتك أولًا'); return; }
  const card = {
    id: 'c_' + Math.random().toString(36).slice(2, 10),
    createdAt: Date.now(),
    occasionId: f.occasionId,
    to: f.to.trim(), from: f.from.trim(),
    shop: f.shop.trim() || 'باقة',
    message: f.message.trim(),
    paletteId: f.paletteId, animId: f.animId, fontId: f.fontId,
  };
  card.url = await CODEC.encodeCard(card);
  if (!state.customerMode) {
    const list = loadCards(); list.unshift(card); saveCards(list);
    renderComposer();
  }
  await showResult(card);
  document.getElementById('result').scrollIntoView({ behavior:'smooth', block:'start' });
}

async function showResult(card) {
  const box = document.getElementById('result');
  if (!box) return;

  const { size } = QR.toPath(url, 'M');
  const mm = printMm(size);
  const r = readability(size);
  box.classList.add('on');
  box.innerHTML = `
    <div class="qr-wrap">${QR.toSVG(url, { ecl:'M', scale:8, margin:4 })}</div>

        ${r.word} · ${size}×${size} · لا تطبعه بعرض أقل من ${mm} مم</div>

  document.getElementById('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast('نُسخ الرابط'); }

    if (!card.id || state.customerMode) { EXPORT_CARD = card; location.hash = 'x'; }

}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light'
    : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('baaqa.theme', next); } catch {}
  refreshPreview();
}

/* =====================================================================
   Print templates.
   Rules that keep them scannable: nothing is ever drawn over the symbol,
   the quiet zone is at least 5 modules, and shape-rendering is crispEdges
   so modules do not antialias into grey when rasterised to PNG.
   ===================================================================== */
function svgOpen(w, h) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" `
    + `font-family="Amiri, 'Times New Roman', serif" shape-rendering="crispEdges">`;
}
function symbol(url, x, y, px) {
  const qr = QR.toPath(url, 'M');
  return { size: qr.size,
    svg: `<g transform="translate(${x}, ${y}) scale(${px / qr.size})"><path d="${qr.path}" fill="#1F1512"/></g>` };
}

function tplCard(card, url) {
  const w = 520, h = 880, o = occOf(card.occasionId);
  const px = 380, x = (w - px) / 2, y = 300;
  const s = symbol(url, x, y, px);
  return svgOpen(w, h) + `
    <defs><pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse">
      <text x="30" y="50" text-anchor="middle" font-size="52" fill="#742036" opacity="0.03">${esc(o.glyph)}</text>
    </pattern></defs>
    <rect width="${w}" height="${h}" fill="#FBF6EF"/>
    <rect width="${w}" height="${h}" fill="url(#p)"/>

async function svgToPng(svg, targetW) {
  const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas');
  cv.width = targetW;
  cv.height = Math.round(targetW * img.height / img.width);
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

async function download(filename, data) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { await dl.save({ filename, data }); toast('تم التحميل'); return; }
  } catch (e) {}
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type:'image/svg+xml' });
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    toast('تم التحميل');
  } catch (e) { toast('التحميل غير متاح — استخدم الطباعة'); }
}

// Shared by the live page and the preview iframe, so it is serialised by name.
function wireRecipient(root, animId, accent, autoplay) {
  const env = root.querySelector('#env');
  const rev = root.querySelector('#rev');
  const cv  = root.querySelector('#cv');
  let opened = false;
  const open = () => {
    if (opened) return;
    opened = true;
    env.classList.add('opening');
    setTimeout(() => {
      env.classList.add('gone');
      rev.classList.add('on');
      runMotion(cv, animId, accent);
    }, 900);
  };
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  if (autoplay) setTimeout(open, 420);
}

/* =====================================================================
   Motion
   ===================================================================== */
function shade(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const c = v => Math.max(0, Math.min(255, v));
  const r = c((n >> 16) + amt), g = c(((n >> 8) & 255) + amt), b = c((n & 255) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
class Balloon {
  constructor(x, y, c) { this.x=x; this.y=y; this.vx=(Math.random()-.5)*.4; this.vy=-(.4+Math.random()*.6);
    this.r=14+Math.random()*18; this.c=c; this.alt=Math.random()<.5; this.s=Math.random()*6.28; this.a=0; this.life=900+Math.random()*400; this.dead=false; }
  update(dt){ this.a+=dt; this.s+=.02*dt; this.x+=this.vx*dt+Math.sin(this.s)*.4; this.y+=this.vy*dt;
    if(this.y<-this.r*4||this.a>this.life) this.dead=true; }
  draw(g){ const al=Math.min(1,this.a/30)*(1-Math.max(0,(this.a-this.life+60)/60));
    g.save(); g.globalAlpha=Math.max(0,al);
    const c1=this.alt?'#F5C56A':this.c, c2=this.alt?'#B98134':shade(this.c,-20);
    const gr=g.createRadialGradient(this.x-this.r*.3,this.y-this.r*.3,this.r*.1,this.x,this.y,this.r);
    gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr;
    g.beginPath(); g.ellipse(this.x,this.y,this.r*.9,this.r,0,0,6.28); g.fill();
    g.beginPath(); g.moveTo(this.x,this.y+this.r); g.lineTo(this.x-2,this.y+this.r+4); g.lineTo(this.x+2,this.y+this.r+4); g.closePath(); g.fillStyle=c2; g.fill();
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1; g.beginPath(); g.moveTo(this.x,this.y+this.r+4);
    for(let i=0;i<20;i++) g.lineTo(this.x+Math.sin(this.s+i*.5)*3, this.y+this.r+4+i*6+Math.sin(this.s+i*.5)*3);
    g.stroke(); g.restore(); }
}
class Petal {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.8; this.vy=.3+Math.random()*.6;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.05; this.sz=8+Math.random()*10; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.03*dt; this.x+=this.vx*dt+Math.sin(this.s)*.6; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30);
    g.fillStyle=this.c; g.beginPath(); g.ellipse(0,0,this.sz,this.sz*.55,0,0,6.28); g.fill();
    g.fillStyle='rgba(255,255,255,.2)'; g.beginPath(); g.ellipse(-this.sz*.3,-this.sz*.15,this.sz*.4,this.sz*.15,0,0,6.28); g.fill(); g.restore(); }
}
class Heart {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.5; this.vy=-(.4+Math.random()*.5);
    this.sz=8+Math.random()*14; this.c=c; this.s=Math.random()*6.28; this.a=0; this.life=500+Math.random()*300; this.dead=false; }
  update(dt){ this.a+=dt; this.s+=.04*dt; this.x+=this.vx*dt+Math.sin(this.s)*.8; this.y+=this.vy*dt;
    if(this.y<-30||this.a>this.life) this.dead=true; }
  draw(g){ const f=Math.min(1,this.a/20)*Math.max(0,1-Math.max(0,this.a-this.life+60)/60);
    g.save(); g.globalAlpha=f; g.fillStyle=this.c; const s=this.sz; g.beginPath();
    g.moveTo(this.x,this.y+s*.3);
    g.bezierCurveTo(this.x,this.y-s*.3,this.x-s,this.y-s*.3,this.x-s,this.y+s*.2);
    g.bezierCurveTo(this.x-s,this.y+s*.7,this.x,this.y+s,this.x,this.y+s*1.1);
    g.bezierCurveTo(this.x,this.y+s,this.x+s,this.y+s*.7,this.x+s,this.y+s*.2);
    g.bezierCurveTo(this.x+s,this.y-s*.3,this.x,this.y-s*.3,this.x,this.y+s*.3);
    g.fill(); g.restore(); }
}
class Sparkle {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*3; this.vy=(Math.random()-.5)*3;
    this.sz=1+Math.random()*3; this.c=c; this.a=0; this.life=60+Math.random()*60; this.dead=false; }
  update(dt){ this.a+=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=.98; this.vy*=.98; if(this.a>this.life) this.dead=true; }
  draw(g){ const t=Math.max(0,1-this.a/this.life); g.save(); g.globalAlpha=t; g.fillStyle=this.c;
    g.shadowColor=this.c; g.shadowBlur=8; g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill();
    g.strokeStyle=this.c; g.lineWidth=.6; g.beginPath();
    g.moveTo(this.x-this.sz*3,this.y); g.lineTo(this.x+this.sz*3,this.y);
    g.moveTo(this.x,this.y-this.sz*3); g.lineTo(this.x,this.y+this.sz*3); g.stroke(); g.restore(); }
}
class Cloud {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=.15+Math.random()*.15; this.sz=40+Math.random()*50; this.c=c; this.a=0; this.dead=false; }
  update(dt,W){ this.a+=dt; this.x+=this.vx*dt; if(this.x-this.sz>W+20) this.dead=true; }
  draw(g){ g.save(); g.globalAlpha=Math.min(1,this.a/60)*.5; g.fillStyle=this.c; const s=this.sz;
    g.beginPath(); g.arc(this.x,this.y,s*.5,0,6.28); g.arc(this.x+s*.4,this.y-s*.1,s*.4,0,6.28);
    g.arc(this.x+s*.8,this.y,s*.5,0,6.28); g.arc(this.x+s*.4,this.y+s*.15,s*.45,0,6.28); g.fill(); g.restore(); }
}
class Bloom {
  constructor(x,y,c){ this.x=x; this.y=y; this.r=0; this.max=80+Math.random()*120; this.c=c; this.a=0; this.life=80+Math.random()*40; this.dead=false; }
  update(dt){ this.a+=dt; this.r=this.max*(1-Math.pow(1-Math.min(1,this.a/this.life),3)); if(this.a>this.life) this.dead=true; }
  draw(g){ const t=Math.max(0,1-this.a/this.life);
    const gr=g.createRadialGradient(this.x,this.y,0,this.x,this.y,Math.max(1,this.r));
    gr.addColorStop(0,this.c+'aa'); gr.addColorStop(.5,this.c+'33'); gr.addColorStop(1,this.c+'00');
    g.save(); g.globalAlpha=t; g.fillStyle=gr; g.beginPath(); g.arc(this.x,this.y,Math.max(1,this.r),0,6.28); g.fill(); g.restore(); }
}
class Rose {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.6; this.vy=.4+Math.random()*.6;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.06; this.sz=10+Math.random()*14; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.04*dt; this.x+=this.vx*dt+Math.sin(this.s)*.8; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30); g.fillStyle=this.c;
    for(let i=0;i<5;i++){ g.save(); g.rotate(i/5*6.28); g.beginPath(); g.ellipse(0,-this.sz*.6,this.sz*.5,this.sz*.7,0,0,6.28); g.fill(); g.restore(); }
    g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.arc(0,0,this.sz*.25,0,6.28); g.fill(); g.restore(); }
}
class Leaf {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*.6; this.vy=.3+Math.random()*.5;
    this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.04; this.sz=10+Math.random()*10; this.c=c; this.s=Math.random()*6.28; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.s+=.03*dt; this.x+=this.vx*dt+Math.sin(this.s)*.9; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+20) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/30); g.fillStyle=this.c;
    g.beginPath(); g.moveTo(0,-this.sz);
    g.bezierCurveTo(this.sz*.8,-this.sz*.4,this.sz*.6,this.sz*.6,0,this.sz);
    g.bezierCurveTo(-this.sz*.6,this.sz*.6,-this.sz*.8,-this.sz*.4,0,-this.sz); g.fill();
    g.strokeStyle='rgba(0,0,0,.15)'; g.lineWidth=1; g.beginPath(); g.moveTo(0,-this.sz); g.lineTo(0,this.sz); g.stroke(); g.restore(); }
}
class Star {
  constructor(x,y,c){ this.x=x; this.y=y; this.base=.3+Math.random()*.7; this.ph=Math.random()*6.28; this.sz=.6+Math.random()*2; this.c=c; this.dead=false; }
  update(dt){ this.ph+=.05*dt; }
  draw(g){ g.save(); g.globalAlpha=this.base*(.5+.5*Math.sin(this.ph)); g.fillStyle=this.c;
    g.shadowColor=this.c; g.shadowBlur=6; g.beginPath(); g.arc(this.x,this.y,this.sz,0,6.28); g.fill(); g.restore(); }
}
class Confetti {
  constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-.5)*2.4; this.vy=-(1.5+Math.random()*2.5);
    this.w=4+Math.random()*6; this.h=7+Math.random()*8; this.rot=Math.random()*6.28; this.vr=(Math.random()-.5)*.3;
    this.c=[c,'#F5C56A','#E85A7C','#7DC49B','#B4C9D6'][(Math.random()*5)|0]; this.a=0; this.dead=false; }
  update(dt,W,H){ this.a+=dt; this.vy+=.055*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.rot+=this.vr*dt; if(this.y>H+30) this.dead=true; }
  draw(g){ g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.globalAlpha=Math.min(1,this.a/12);
    g.fillStyle=this.c; g.fillRect(-this.w/2,-this.h/2,this.w,this.h); g.restore(); }
}

function emitters(type) {
  const drip = (P,W,H,c,dt,rate,make) => { if (Math.random() < rate*dt) P.push(make(W,H,c)); };
  const map = {
    balloons:{ burst:(P,W,H,c)=>{for(let i=0;i<8;i++)P.push(new Balloon(Math.random()*W,H+Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.08,()=>new Balloon(Math.random()*W,H+30,c)) },
    petals:{   burst:(P,W,H,c)=>{for(let i=0;i<20;i++)P.push(new Petal(Math.random()*W,Math.random()*H*.5-40,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.25,()=>new Petal(Math.random()*W,-20,c)) },
    hearts:{   burst:(P,W,H,c)=>{for(let i=0;i<6;i++)P.push(new Heart(W/2+(Math.random()-.5)*80,H*.7+Math.random()*40,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.15,()=>new Heart(Math.random()*W,H+20,c)) },
    sparkles:{ burst:(P,W,H,c)=>{for(let i=0;i<40;i++)P.push(new Sparkle(W/2+(Math.random()-.5)*200,H/2+(Math.random()-.5)*200,c));},
               emit:(P,W,H,c,dt)=>{ if(Math.random()<.5*dt) for(let i=0;i<3;i++) P.push(new Sparkle(Math.random()*W,Math.random()*H,c)); } },
    clouds:{   burst:(P,W,H,c)=>{for(let i=0;i<3;i++)P.push(new Cloud(Math.random()*W-100,Math.random()*H*.6+50,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.005,()=>new Cloud(-80,Math.random()*H*.6+40,c)) },
    bloom:{    burst:(P,W,H,c)=>{P.push(new Bloom(W/2,H/2,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.008,()=>new Bloom(Math.random()*W,Math.random()*H,c)) },
    roses:{    burst:(P,W,H,c)=>{for(let i=0;i<10;i++)P.push(new Rose(Math.random()*W,-Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.12,()=>new Rose(Math.random()*W,-20,c)) },
    leaves:{   burst:(P,W,H,c)=>{for(let i=0;i<8;i++)P.push(new Leaf(Math.random()*W,-Math.random()*100,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.12,()=>new Leaf(Math.random()*W,-20,c)) },
    stars:{    burst:(P,W,H,c)=>{for(let i=0;i<120;i++)P.push(new Star(Math.random()*W,Math.random()*H,c));},
               emit:()=>{} },
    confetti:{ burst:(P,W,H,c)=>{for(let i=0;i<70;i++)P.push(new Confetti(W/2+(Math.random()-.5)*W*.5,H*.55,c));},
               emit:(P,W,H,c,dt)=>drip(P,W,H,c,dt,.10,()=>new Confetti(Math.random()*W,-20,c)) },
  };
  return map[type] || map.sparkles;
}

function runMotion(canvas, animId, accent) {
  if (!canvas) return;
  const g = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const fit = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  window.addEventListener('resize', fit);
  const W = () => canvas.clientWidth, H = () => canvas.clientHeight;
  const P = [], em = emitters(animId);
  em.burst && em.burst(P, W(), H(), accent);
  let last = performance.now();
  const started = last;
  (function frame(now) {
    const dt = Math.min(40, now - last) / 16.67;
    last = now;
    if (em.emit) em.emit(P, W(), H(), accent, dt);
    g.clearRect(0, 0, W(), H());
    for (let i = P.length - 1; i >= 0; i--) {
      P[i].update(dt, W(), H());
      if (P[i].dead) { P.splice(i, 1); continue; }
      P[i].draw(g);
    }
    if (now - started < 90000) requestAnimationFrame(frame);
  })(last);
}

// Serialised into the preview iframe.
const MOTION_SRC = () => [shade, Balloon, Petal, Heart, Sparkle, Cloud, Bloom,
  Rose, Leaf, Star, Confetti, emitters, runMotion].map(f => f.toString()).join('\n');

/* =====================================================================
   Router
   ===================================================================== */
async function boot() {
  try {
    const t = localStorage.getItem('baaqa.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch {}

  document.querySelectorAll('.recipient').forEach(n => n.remove());
  document.body.style.background = '';

  const h = location.hash;

  if (h.startsWith('#d/') || h.startsWith('#c/')) {
    const card = await CODEC.decodeHash(h);
    if (card) { renderRecipient(card); return; }
    toast('رابط الكرت غير صالح');
  }
  if (h.startsWith('#e/')) {
    const card = loadCards().find(c => c.id === h.slice(3));
    if (card) { await renderExport(card); return; }
  }
  if (h === '#x' && EXPORT_CARD) { await renderExport(EXPORT_CARD); return; }

  state.customerMode = (h === '#new');
  renderComposer();
}

window.addEventListener('hashchange', boot);
boot();
</script>
