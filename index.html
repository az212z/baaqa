<title>باقة — كروت باركود</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">

<style>
:root {
  --bg: #F6EFE7;
  --bg-2: #EFE5D8;
  --surface: #FFFFFF;
  --surface-2: #FBF6EF;
  --ink: #1F1512;
  --ink-2: #4A362E;
  --muted: #8B7168;
  --line: rgba(31,21,18,0.10);
  --line-2: rgba(31,21,18,0.18);
  --accent: #742036;
  --accent-2: #9B2A45;
  --blush: #E8B4A7;
  --gold: #B08549;
  --gold-2: #8E6A38;
  --ok: #2F6B4A;
  --shadow-sm: 0 1px 2px rgba(31,21,18,0.06), 0 4px 12px rgba(31,21,18,0.04);
  --shadow-md: 0 4px 12px rgba(31,21,18,0.08), 0 20px 40px rgba(31,21,18,0.08);
  --shadow-lg: 0 24px 60px rgba(31,21,18,0.18), 0 8px 24px rgba(31,21,18,0.10);
  --radius: 14px;
  --radius-sm: 8px;
  --font-display: "Amiri", "Cormorant Garamond", "Times New Roman", serif;
  --font-ui: "Tajawal", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-eyebrow: "Reem Kufi", "Tajawal", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160B0E;
    --bg-2: #1E1216;
    --surface: #22141A;
    --surface-2: #2A1A20;
    --ink: #F0E6DD;
    --ink-2: #D6C7BB;
    --muted: #96827A;
    --line: rgba(240,230,221,0.10);
    --line-2: rgba(240,230,221,0.18);
    --accent: #C94664;
    --accent-2: #E15A79;
    --blush: #E8B4A7;
    --gold: #D4A76A;
    --gold-2: #B8894D;
    --ok: #5FB58A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.65), 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #160B0E;
  --bg-2: #1E1216;
  --surface: #22141A;
  --surface-2: #2A1A20;
  --ink: #F0E6DD;
  --ink-2: #D6C7BB;
  --muted: #96827A;
  --line: rgba(240,230,221,0.10);
  --line-2: rgba(240,230,221,0.18);
  --accent: #C94664;
  --accent-2: #E15A79;
  --blush: #E8B4A7;
  --gold: #D4A76A;
  --gold-2: #B8894D;
  --ok: #5FB58A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.65), 0 8px 24px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { direction: rtl; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Chrome (top bar) ---------- */
.chrome {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
}
.chrome-inner {
  max-width: 1240px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 18px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-weight: 700; font-size: 22px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.logo-mark {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--blush), var(--accent) 70%);
  box-shadow: inset -3px -3px 8px rgba(0,0,0,.15);
  position: relative;
}
.logo-mark::after {
  content: ""; position: absolute; inset: 6px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
}
.logo small {
  font-family: var(--font-eyebrow);
  font-size: 10px; font-weight: 500;
  letter-spacing: .16em;
  color: var(--muted);
  text-transform: uppercase;
  display: block; margin-top: -2px;
}
.chrome-tabs { display: flex; gap: 4px; margin-inline-start: auto; }
.chrome-tab {
  padding: 8px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  color: var(--muted);
  transition: color .15s, background .15s;
}
.chrome-tab:hover { color: var(--ink); }
.chrome-tab.active {
  background: var(--ink); color: var(--bg);
}
.theme-btn {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--muted);
  border: 1px solid var(--line-2);
  transition: color .15s, border-color .15s;
}
.theme-btn:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- Layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }
.hero-eyebrow {
  font-family: var(--font-eyebrow);
  font-size: 11px; letter-spacing: .22em;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 10px;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.6vw, 44px);
  line-height: 1.15;
  color: var(--ink);
  margin: 0 0 8px;
  font-weight: 700;
  text-wrap: balance;
}
.hero-title em { color: var(--accent); font-style: italic; font-weight: 400; }
.hero-sub {
  color: var(--muted); font-size: 15px;
  max-width: 62ch; margin: 0;
}

/* Composer grid */
.composer {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 28px;
  margin-top: 32px;
  align-items: start;
}
@media (max-width: 900px) {
  .composer { grid-template-columns: 1fr; }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow-sm);
}
.panel-title {
  font-family: var(--font-eyebrow);
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 0 14px;
  display: flex; align-items: center; gap: 10px;
}
.panel-title::before, .panel-title::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.panel-title::before { flex: 0 0 8px; }

/* Occasion grid */
.occasion-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 480px) { .occasion-grid { grid-template-columns: repeat(2, 1fr); } }
.occasion {
  position: relative; padding: 14px 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-2);
  text-align: center;
  transition: transform .15s, border-color .15s, background .15s;
  cursor: pointer;
}
.occasion:hover { transform: translateY(-2px); border-color: var(--line-2); }
.occasion.selected {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 15%, transparent);
}
.occasion .glyph {
  font-family: var(--font-display);
  font-size: 26px; line-height: 1;
  display: block; height: 32px;
  margin-bottom: 6px;
  color: var(--accent);
}
.occasion .label {
  font-size: 12px; font-weight: 500; color: var(--ink);
}
.occasion .sub {
  font-size: 10px; color: var(--muted);
  margin-top: 2px;
  font-family: var(--font-eyebrow);
  letter-spacing: .08em;
}

/* Form fields */
.field { margin-top: 16px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.field-label {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-family: var(--font-eyebrow);
}
.field input,
.field textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--ink);
  transition: border-color .15s, background .15s;
}
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}
.field textarea {
  min-height: 120px;
  resize: vertical;
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.7;
}
.field-hint {
  display: flex; justify-content: space-between;
  margin-top: 6px; font-size: 11px;
  color: var(--muted);
  font-family: var(--font-eyebrow);
  letter-spacing: .05em;
}

/* Fonts + music picker */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12px;
  color: var(--ink-2);
  transition: all .15s;
}
.chip:hover { border-color: var(--line-2); }
.chip.on {
  background: var(--ink); color: var(--bg);
  border-color: var(--ink);
}

/* Preview */
.preview-shell {
  position: sticky; top: 96px;
  display: flex; flex-direction: column; gap: 18px;
}
.preview-frame {
  aspect-ratio: 9 / 16;
  max-height: 620px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow-md);
}
.preview-frame::before {
  content: ""; position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 4px; border-radius: 2px;
  background: color-mix(in oklab, var(--ink) 15%, transparent);
  z-index: 10;
}
.preview-frame iframe {
  width: 100%; height: 100%; border: 0;
  background: var(--surface);
}
.preview-actions {
  display: flex; gap: 10px;
}
.btn {
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 14px; font-weight: 500;
  transition: transform .1s, background .15s, opacity .15s;
  display: inline-flex; align-items: center; gap: 8px;
  justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--ink); color: var(--bg);
  flex: 1;
}
.btn-primary:hover { background: var(--accent); }
.btn-secondary {
  background: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--line-2);
}
.btn-secondary:hover { border-color: var(--ink); }
.btn-ghost {
  color: var(--muted);
  padding: 8px 10px;
  font-size: 13px;
}
.btn-ghost:hover { color: var(--ink); }

/* Result card (QR + share) */
.result {
  display: none;
  margin-top: 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  box-shadow: var(--shadow-md);
  animation: fadeUp .5s ease;
}
.result.on { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .result.on { grid-template-columns: 1fr; text-align: center; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.qr-wrap {
  background: #fff;
  padding: 18px;
  border-radius: 14px;
  border: 1px solid var(--line);
  display: inline-block;
  position: relative;
}
.qr-wrap svg { display: block; width: 200px; height: 200px; }
.qr-wrap .qr-brand {
  position: absolute; inset: 50% auto auto 50%;
  transform: translate(50%, -50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700;
  font-size: 20px;
  box-shadow: 0 0 0 4px #fff;
}
.result-body h3 {
  font-family: var(--font-display);
  font-size: 26px;
  margin: 0 0 6px;
  color: var(--ink);
}
.result-body p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.share-link {
  display: flex; align-items: center; gap: 0;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px 4px 4px 12px;
  margin-top: 8px;
  overflow: hidden;
}
.share-link input {
  flex: 1; background: transparent; border: 0; padding: 8px 4px;
  color: var(--ink-2); font-size: 12px;
  min-width: 0;
  direction: ltr; text-align: left;
}
.share-link button {
  padding: 8px 14px; border-radius: 8px;
  background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 500;
}
.share-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.share-row .btn { flex: 1 1 auto; }

/* Gallery */
.gallery {
  margin-top: 48px;
}
.gallery-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
}
.gallery-head h2 {
  font-family: var(--font-display);
  font-size: 24px; margin: 0;
  color: var(--ink);
}
.gallery-head span { color: var(--muted); font-size: 13px; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.gcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  transition: transform .15s, border-color .15s;
  cursor: pointer;
  position: relative;
}
.gcard:hover { transform: translateY(-2px); border-color: var(--line-2); }
.gcard-tag {
  font-family: var(--font-eyebrow);
  font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.gcard-to {
  font-family: var(--font-display);
  font-size: 18px; color: var(--ink);
  margin: 0 0 4px;
}
.gcard-msg {
  font-size: 13px; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 34px;
}
.gcard-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 11px; color: var(--muted);
  font-family: var(--font-eyebrow); letter-spacing: .08em;
}
.gcard-del {
  color: var(--muted); font-size: 12px;
  padding: 4px 6px; border-radius: 4px;
}
.gcard-del:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
.gallery-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px dashed var(--line-2);
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 16px;
}

/* ========================================================
   RECIPIENT VIEW — full-screen envelope + animated card
   ======================================================== */
.recipient {
  position: fixed; inset: 0;
  background: var(--rec-bg, #1a0d10);
  color: var(--rec-ink, #f8ecd8);
  overflow: hidden;
  z-index: 100;
  display: none;
}
.recipient.on { display: block; }
.rec-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}
.rec-stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  perspective: 1400px;
  z-index: 2;
}

/* Envelope */
.envelope {
  --w: min(88vw, 420px);
  width: var(--w);
  aspect-ratio: 3 / 2;
  position: relative;
  transform-style: preserve-3d;
  cursor: pointer;
  transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .8s;
}
.env-body {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #f6e6c9, #e6cfa8);
  border-radius: 6px;
  box-shadow:
    0 40px 80px rgba(0,0,0,.55),
    0 8px 24px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.35);
}
.env-body::before {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(60deg, transparent 49%, rgba(0,0,0,.06) 50%, transparent 51%) 50% 100% / 100% 50% no-repeat,
    linear-gradient(-60deg, transparent 49%, rgba(0,0,0,.06) 50%, transparent 51%) 50% 100% / 100% 50% no-repeat;
  border-radius: 0 0 6px 6px;
}
.env-flap {
  position: absolute; top: 0; left: 0; right: 0;
  height: 60%;
  background: linear-gradient(180deg, #eed7ac, #d8ba82);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform 1s cubic-bezier(.6,.05,.3,1);
  box-shadow: inset 0 -6px 12px rgba(0,0,0,.12);
  z-index: 3;
}
.envelope.opening .env-flap { transform: rotateX(180deg); z-index: 1; }
.envelope.opening .env-inner { transform: translateY(-58%) rotate(0deg) scale(1); opacity: 1; }
.envelope.opening { transform: translateY(-30%) scale(1.05); }
.envelope.gone { opacity: 0; transform: translateY(-60%) scale(.9); pointer-events: none; }

.env-inner {
  position: absolute;
  left: 8%; right: 8%; top: 15%; bottom: 15%;
  background: linear-gradient(180deg, #fdfaf3, #f5ecd8);
  border-radius: 4px;
  z-index: 2;
  transform: translateY(0) scale(.98);
  opacity: .9;
  transition: transform 1.2s cubic-bezier(.2,.7,.2,1) .3s, opacity 1s .3s;
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.env-inner-mark {
  font-family: var(--font-display);
  font-size: 48px;
  color: var(--rec-accent, #742036);
  opacity: .6;
}

/* Wax seal */
.env-seal {
  position: absolute;
  left: 50%; top: 55%;
  transform: translate(-50%, -50%);
  width: 74px; height: 74px;
  z-index: 4;
  transition: transform .5s, opacity .5s;
}
.envelope.opening .env-seal { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
.env-seal-circle {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #a83143, var(--rec-accent, #742036) 70%, #4b0f1f);
  box-shadow:
    inset -4px -6px 10px rgba(0,0,0,.5),
    inset 3px 4px 8px rgba(255,255,255,.15),
    0 4px 12px rgba(0,0,0,.4);
  display: grid; place-items: center;
  color: rgba(255,255,255,.85);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  position: relative;
}
.env-seal-circle::before {
  content: ""; position: absolute; inset: 6px;
  border: 1px dashed rgba(255,255,255,.4);
  border-radius: 50%;
}
.env-hint {
  position: absolute;
  bottom: 8%; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-eyebrow);
  font-size: 11px;
  letter-spacing: .28em;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  animation: pulseUp 2.2s ease-in-out infinite;
  z-index: 5;
}
@keyframes pulseUp {
  0%,100% { transform: translateY(0); opacity: .5; }
  50% { transform: translateY(-6px); opacity: .95; }
}

/* Revealed message */
.reveal {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px;
  opacity: 0; pointer-events: none;
  transition: opacity 1s ease .3s;
  z-index: 3;
}
.reveal.on { opacity: 1; pointer-events: auto; }
.reveal-inner {
  max-width: 560px; width: 100%;
  text-align: center;
  color: var(--rec-ink, #f8ecd8);
}
.reveal-eyebrow {
  font-family: var(--font-eyebrow);
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--rec-accent, #E8B4A7);
  margin-bottom: 8px;
  opacity: 0;
  animation: rise 1s ease .8s forwards;
}
.reveal-to {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(22px, 4.5vw, 32px);

          case 0: inv = (x+y)%2===0; break;
          case 1: inv = y%2===0; break;
          case 2: inv = x%3===0; break;
          case 3: inv = (x+y)%3===0; break;
          case 4: inv = (Math.floor(x/3)+Math.floor(y/2))%2===0; break;
          case 5: inv = ((x*y)%2 + (x*y)%3)===0; break;
          case 6: inv = ((x*y)%2 + (x*y)%3)%2===0; break;
          case 7: inv = ((x+y)%2 + (x*y)%3)%2===0; break;
        }
        if (inv) trial[y][x] ^= 1;
      }
      const eclBits = {L:1,M:0,Q:3,H:2}[ecl];
      let data = (eclBits << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i++) {
        rem = rem << 1;
        if (rem & 0x400) rem ^= 0x537;
      }
      const fmt = (((data << 10) | rem) ^ 0x5412) & 0x7FFF;
      for (let i = 0; i <= 5; i++) trial[8][i] = (fmt >> i) & 1;
      trial[8][7] = (fmt >> 6) & 1;
      trial[8][8] = (fmt >> 7) & 1;
      trial[7][8] = (fmt >> 8) & 1;
      for (let i = 9; i < 15; i++) trial[14 - i][8] = (fmt >> i) & 1;
      for (let i = 0; i < 8; i++) trial[size - 1 - i][8] = (fmt >> i) & 1;
      for (let i = 8; i < 15; i++) trial[8][size - 15 + i] = (fmt >> i) & 1;
      trial[size - 8][8] = 1;

      if (ver >= 7) {
        let vrem = ver;
        for (let i = 0; i < 12; i++) {
          vrem = vrem << 1;
          if (vrem & 0x1000) vrem ^= 0x1F25;
        }
        const vbits = ((ver << 12) | vrem) & 0x3FFFF;
        for (let i = 0; i < 18; i++) {
          const b = (vbits >> i) & 1;
          const a = size - 11 + i % 3, bb = Math.floor(i / 3);
          trial[a][bb] = b; trial[bb][a] = b;
        }
      }

      const sc = score(trial);
      if (sc < bestScore) { bestScore = sc; bestMask = mask; bestMatrix = trial; }
    }
    return { matrix: bestMatrix, size };
  }

  function encode(text, ecl = 'M') {
    const bytes = new TextEncoder().encode(text);
    const ver = pickVersion(bytes, ecl);
    const bs = buildBitStream(bytes, ver, ecl);
    const cw = interleaveBlocks(bs, ver, ecl);
    return buildMatrix(ver, ecl, cw);
  }

  function toSVG(text, opts = {}) {
    const ecl = opts.ecl || 'M';
    const { matrix, size } = encode(text, ecl);
    const scale = opts.scale || 6;
    const margin = opts.margin || 2;
    const total = (size + margin * 2) * scale;
    const color = opts.color || '#1F1512';
    const bg = opts.bg || '#ffffff';
    let paths = '';
    for (let y = 0; y < size; y++) {
      let run = 0;
      for (let x = 0; x <= size; x++) {
        if (x < size && matrix[y][x]) run++;
        else if (run > 0) {
          paths += `M${(x - run + margin) * scale} ${(y + margin) * scale}h${run * scale}v${scale}h${-run * scale}z`;
          run = 0;
        }
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="${bg}"/><path d="${paths}" fill="${color}"/></svg>`;
  }

  return { encode, toSVG };
})();

function b64UrlEncode(obj) {
  const s = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64UrlDecode(s) {
  try {
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}

function cardUrl(card) {
  const base = location.origin + location.pathname;
  const payload = { o: card.occasionId, t: card.to, m: card.message, f: card.from, s: card.shop };
  return base + '#c/' + b64UrlEncode(payload);
}

function parseRoute() {
  const h = location.hash;
  if (h.startsWith('#c/')) {
    const payload = b64UrlDecode(h.slice(3));
    if (payload) {
      return { view: 'recipient', card: {
        occasionId: payload.o, to: payload.t, message: payload.m, from: payload.f, shop: payload.s
      }};
    }
  }
  if (h.startsWith('#e/')) {
    const id = h.slice(3);
    const card = loadCards().find(c => c.id === id);
    if (card) return { view: 'export', card };
  }
  return { view: 'admin' };
}

function attachRecipient(root, card, oc, opts = {}) {
  const env = root.querySelector('#envelope');
  const reveal = root.querySelector('#reveal');
  const back = root.querySelector('#recBack');
  const canvas = root.querySelector('#recCanvas');
  if (back) back.onclick = () => { location.hash = ''; };
  let opened = false;
  const open = () => {
    if (opened) return;
    opened = true;
    env.classList.add('opening');
    setTimeout(() => {
      env.classList.add('gone');
      reveal.classList.add('on');
      startMotion(canvas, oc, card);
    }, 900);
  };
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  if (opts.autoplay) setTimeout(open, 400);
}

function startMotion(canvas, oc, card) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const resize = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener('resize', resize);
  const W = () => canvas.clientWidth;
  const H = () => canvas.clientHeight;
  const particles = [];
  const emitters = getEmitters(oc.motion);
  emitters.burst && emitters.burst(particles, W(), H(), oc.theme.accent);
  let last = performance.now();
  const stopAfter = 90000;
  const started = last;
  function frame(now) {
    const dt = Math.min(40, now - last) / 16.67;
    last = now;
    if (emitters.emit) emitters.emit(particles, W(), H(), oc.theme.accent, dt);
    ctx.clearRect(0, 0, W(), H());
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update(dt, W(), H());
      if (p.dead) { particles.splice(i, 1); continue; }
      p.draw(ctx);
    }
    if (now - started < stopAfter) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

class Balloon {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = -(0.4 + Math.random() * 0.6);
    this.r = 14 + Math.random() * 18;
    this.color = color;
    this.hueShift = Math.random() < 0.5;
    this.sway = Math.random() * Math.PI * 2;
    this.age = 0;
    this.life = 900 + Math.random() * 400;
    this.dead = false;
  }
  update(dt, W, H) {
    this.age += dt;
    this.sway += 0.02 * dt;
    this.x += this.vx * dt + Math.sin(this.sway) * 0.4;
    this.y += this.vy * dt;
    if (this.y < -this.r * 4 || this.age > this.life) this.dead = true;
  }
  draw(ctx) {
    const alpha = Math.min(1, this.age / 30) * (1 - Math.max(0, (this.age - this.life + 60) / 60));
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    const c1 = this.hueShift ? '#F5C56A' : this.color;
    const c2 = this.hueShift ? '#B98134' : shade(this.color, -20);
    const grad = ctx.createRadialGradient(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.1, this.x, this.y, this.r);
    grad.addColorStop(0, c1); grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.r * 0.9, this.r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(this.x, this.y + this.r);
    ctx.lineTo(this.x - 2, this.y + this.r + 4); ctx.lineTo(this.x + 2, this.y + this.r + 4); ctx.closePath();
    ctx.fillStyle = c2; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y + this.r + 4);
    for (let i = 0; i < 20; i++) {
      const yy = this.y + this.r + 4 + i * 6 + Math.sin(this.sway + i * 0.5) * 3;
      ctx.lineTo(this.x + Math.sin(this.sway + i * 0.5) * 3, yy);
    }
    ctx.stroke();
    ctx.restore();
  }
}

class Petal {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = 0.3 + Math.random() * 0.6;
    this.rot = Math.random() * Math.PI * 2;
    this.vr = (Math.random() - 0.5) * 0.05;
    this.size = 8 + Math.random() * 10;
    this.color = color;
    this.sway = Math.random() * Math.PI * 2;
    this.age = 0;
    this.dead = false;
  }
  update(dt, W, H) {
    this.age += dt;
    this.sway += 0.03 * dt;
    this.x += this.vx * dt + Math.sin(this.sway) * 0.6;
    this.y += this.vy * dt;
    this.rot += this.vr * dt;
    if (this.y > H + 20) this.dead = true;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = Math.min(1, this.age / 30);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath();
    ctx.ellipse(-this.size*0.3, -this.size*0.15, this.size*0.4, this.size*0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Heart {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = -(0.4 + Math.random() * 0.5);
    this.size = 8 + Math.random() * 14;
    this.color = color;
    this.sway = Math.random() * Math.PI * 2;
    this.age = 0;
    this.life = 500 + Math.random() * 300;
    this.dead = false;
  }
  update(dt, W, H) {
    this.age += dt;
    this.sway += 0.04 * dt;
    this.x += this.vx * dt + Math.sin(this.sway) * 0.8;
    this.y += this.vy * dt;
    if (this.y < -30 || this.age > this.life) this.dead = true;
  }
  draw(ctx) {
    const fade = Math.min(1, this.age/20) * Math.max(0, 1 - Math.max(0, this.age - this.life + 60)/60);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    const s = this.size;
    ctx.moveTo(this.x, this.y + s*0.3);
    ctx.bezierCurveTo(this.x, this.y - s*0.3, this.x - s, this.y - s*0.3, this.x - s, this.y + s*0.2);
    ctx.bezierCurveTo(this.x - s, this.y + s*0.7, this.x, this.y + s, this.x, this.y + s*1.1);
    ctx.bezierCurveTo(this.x, this.y + s, this.x + s, this.y + s*0.7, this.x + s, this.y + s*0.2);
    ctx.bezierCurveTo(this.x + s, this.y - s*0.3, this.x, this.y - s*0.3, this.x, this.y + s*0.3);
    ctx.fill();
    ctx.restore();
  }
}

class Sparkle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = (Math.random() - 0.5) * 3;
    this.size = 1 + Math.random() * 3;
    this.color = color;
    this.age = 0;
    this.life = 60 + Math.random() * 60;
    this.dead = false;
  }
  update(dt) {
    this.age += dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= 0.98; this.vy *= 0.98;
    if (this.age > this.life) this.dead = true;
  }
  draw(ctx) {
    const t = Math.max(0, 1 - this.age / this.life);
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(this.x - this.size*3, this.y); ctx.lineTo(this.x + this.size*3, this.y);
    ctx.moveTo(this.x, this.y - this.size*3); ctx.lineTo(this.x, this.y + this.size*3);
    ctx.stroke();
    ctx.restore();
  }
}

class Cloud {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = 0.15 + Math.random() * 0.15;
    this.size = 40 + Math.random() * 50;
    this.color = color;
    this.age = 0;
    this.dead = false;
  }
  update(dt, W) {
    this.age += dt;
    this.x += this.vx * dt;
    if (this.x - this.size > W + 20) this.dead = true;
  }
  draw(ctx) {
    const fade = Math.min(1, this.age / 60) * 0.5;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = this.color;
    const s = this.size;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s*0.5, 0, Math.PI*2);
    ctx.arc(this.x + s*0.4, this.y - s*0.1, s*0.4, 0, Math.PI*2);
    ctx.arc(this.x + s*0.8, this.y, s*0.5, 0, Math.PI*2);
    ctx.arc(this.x + s*0.4, this.y + s*0.15, s*0.45, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

class Bloom {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.r = 0;
    this.maxR = 80 + Math.random() * 120;
    this.color = color;
    this.age = 0;
    this.life = 80 + Math.random() * 40;
    this.dead = false;
  }
  update(dt) {
    this.age += dt;
    this.r = this.maxR * (1 - Math.pow(1 - Math.min(1, this.age / this.life), 3));
    if (this.age > this.life) this.dead = true;
  }
  draw(ctx) {
    const t = Math.max(0, 1 - this.age / this.life);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    grad.addColorStop(0, this.color + 'aa');
    grad.addColorStop(0.5, this.color + '33');
    grad.addColorStop(1, this.color + '00');
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Rose {
  constructor(x, y, color) {

class Leaf {
  constructor(x, y, color) {

  update(dt, W, H) {

class Star {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.baseA = 0.3 + Math.random() * 0.7;
    this.phase = Math.random() * Math.PI * 2;
    this.size = 0.6 + Math.random() * 2;
    this.color = color;
    this.age = 0;
    this.dead = false;
  }
  update(dt) {
    this.age += dt;
    this.phase += 0.05 * dt;
  }
  draw(ctx) {
    const a = this.baseA * (0.5 + 0.5 * Math.sin(this.phase));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function shade(hex, amt) {
  const c = hex.replace('#','');
  const n = parseInt(c, 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function qrToPath(text, ecl = 'M') {
  const { matrix, size } = QR.encode(text, ecl);
  let d = '';
  for (let y = 0; y < size; y++) {
    let run = 0;
    for (let x = 0; x <= size; x++) {
      if (x < size && matrix[y][x]) run++;
      else if (run > 0) {
        d += `M${x - run} ${y}h${run}v1h${-run}z`;
        run = 0;
      }
    }
  }
  return { path: d, size };
}

}

    <circle cx="${s/2}" cy="${qrY + qrPx/2}" r="22" fill="#742036" stroke="#FBF6EF" stroke-width="3"/>
    <text x="${s/2}" y="${qrY + qrPx/2 + 9}" text-anchor="middle" font-size="22" fill="#F6EFE7">${escapeHtml(oc.glyph)}</text>
    <text x="${s/2}" y="${s - 55}" text-anchor="middle" font-size="13" fill="#4A362E" direction="rtl">امسح لفتح الكرت</text>
    <text x="${s/2}" y="${s - 30}" text-anchor="middle" font-family="Reem Kufi, sans-serif" font-size="10" letter-spacing="3" fill="#8B7168" direction="rtl">${escapeHtml(card.shop || 'باقة')}</text>
  </svg>`;
}

function buildBareSVG(card, oc, url) {
  const s = 400;
  const qr = qrToPath(url, 'M');
  const qrPx = 360;
  const scale = qrPx / qr.size;
  const off = (s - qrPx) / 2;
  return svgHead(s, s) + `
    <rect width="${s}" height="${s}" fill="#ffffff"/>
    <g transform="translate(${off}, ${off}) scale(${scale})"><path d="${qr.path}" fill="#1F1512"/></g>
    <circle cx="${s/2}" cy="${s/2}" r="24" fill="#742036"/>
    <text x="${s/2}" y="${s/2 + 10}" text-anchor="middle" font-size="26" fill="#F6EFE7">${escapeHtml(oc.glyph)}</text>
  </svg>`;
}

async function svgToPngBlob(svg, targetW = 1200) {
  const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = url;
  });
  const ratio = img.height / img.width;
  const w = targetW;
  const h = Math.round(targetW * ratio);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function tryDownload(filename, data) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) {
      await dl.save({ filename, data });
      toast('تم تحميل الملف');
      return true;
    }
  } catch (e) {}
  // Fallback: use a data URL download link
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('تم تحميل الملف');
    return true;
  } catch (e) {
    toast('التحميل غير متاح');
    return false;
  }
}

              <div class="meta-row"><span>تاريخ</span><span>${new Date(card.createdAt).toLocaleDateString('ar-SA')}</span></div>

  render();
  document.getElementById('layoutPicker').addEventListener('click', e => {

function boot() {
  try {
    const saved = localStorage.getItem('baaqa.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch {}
  const r = parseRoute();
  if (r.view === 'recipient') renderRecipient(r.card);
  else if (r.view === 'export') renderExport(r.card);
  else renderAdmin();
}

window.addEventListener('hashchange', () => {
  const existing = document.querySelector('.recipient');
  if (existing) existing.remove();
  document.body.style.background = '';
  boot();
});

boot();
</script>
